  };


  // ── Centro Logístico XLSX parser ───────────────────────────────
  const parseCentroXlsx = (arrayBuffer, centroKey) => {
    try {
      const wb = XLSX.read(arrayBuffer, { type:"array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
      if (rows.length < 2) return;
      // Normalize code: 700210->0210, 70A040->A040, 706211->6211
      const normCode = (v) => {
        if (!v) return "";
        let s = String(v).trim();
        if (/^700\d{3}$/.test(s)) return s.slice(3).padStart(4,"0");
        if (/^700\d+$/.test(s)) return s.slice(3);
        if (/^70[A-Z]/.test(s)) return s.slice(2);
        if (/^706/.test(s)) return s.slice(1); // 706211 -> 6211
        if (/^707/.test(s)) return s.slice(1);
        return s;
      };
      const stockMap = {};
      // Use header row to detect columns
      const hdr = (rows[0] || []).map(h => h ? String(h).toLowerCase() : "");
      const colMat  = hdr.findIndex(h => h.includes("material"));
      const colDesc = hdr.findIndex(h => h.includes("texto") || h.includes("denom"));
      const colLibre = hdr.findIndex(h => h.includes("libre"));
      const colBloq  = hdr.findIndex(h => h.includes("bloq"));
      const colUmb   = hdr.findIndex(h => h.includes("unidad"));
      rows.slice(1).forEach(row => {
        const cod  = normCode(row[colMat  >= 0 ? colMat  : 0]);
        const desc = colDesc >= 0 && row[colDesc] ? String(row[colDesc]).trim() : "";
        const libre = colLibre >= 0 && row[colLibre] ? Number(row[colLibre]) : 0;
        const bloq  = colBloq  >= 0 && row[colBloq]  ? Number(row[colBloq])  : 0;
        const umb   = colUmb   >= 0 && row[colUmb]   ? String(row[colUmb]).trim() : "";
        if (cod && cod !== "material") stockMap[cod] = { libre, bloq, umb, desc };
      });
      // Autocompletar PCK/CJ y Uds/Pale desde el catálogo de productos
      const autoInputs = {};
      try {
        const cat = JSON.parse(localStorage.getItem("diario_productos") || "[]");
        Object.keys(stockMap).forEach(cod => {
          const prod = cat.find(p => p.cod === cod);
          if (prod) autoInputs[cod] = { pckCj: prod.pck || "", uPale: prod.uds || "" };
        });
      } catch(e) {}
      setPaleInputs(autoInputs);
      setCentrosData(prev => ({ ...prev, [centroKey]: stockMap }));
      setCentrosFecha(prev => ({ ...prev, [centroKey]: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) }));
      showSaved("✓ Centro " + {moras:"Moras",ar2:"Autoradio 2",ar1:"Autoradio 1"}[centroKey] + ": " + Object.keys(stockMap).length + " referencias");
    } catch(e) { console.error("parseCentroXlsx:", e); showSaved("⚠️ Error: " + e.message); }
  };

  const renderCentros = () => {
    const centros = [
      { key:"moras", label:"Moras",       color:"#38BDF8" },
      { key:"ar2",   label:"Autoradio 2", color:"#6B7280" },
      { key:"ar1",   label:"Autoradio 1", color:"#9CA3AF" },
    ];

    // Criticals from active factory only
    const criticos = [];
    sortCriticos(dayData[activeFab]?.sapCriticos || []).forEach(r => {
      const clientes = (dayData[activeFab]?.pedidosMap?.[r.cod] || []);
      const fac = FACTORIES.find(f => f.id === activeFab);
      criticos.push({ fac, r, clientes });
    });

    const calcPales = (stock, umb, pckCj, uPale) => {
      if (!uPale || !stock) return null;
      const u = (umb||"").trim().toUpperCase();
      if (u === "PCK" && pckCj > 0) return (stock / pckCj / uPale).toFixed(2);
      if (["CJ","BRL","BDJ","PAL","CS","UN"].includes(u) || u !== "PCK") return (stock / uPale).toFixed(2);
      return null;
    };

    return (
      <div style={{ padding:"0 4px" }}>
        {/* Header buttons */}
        <div style={{ display:"flex", gap:"12px", marginBottom:"20px", flexWrap:"wrap", alignItems:"center" }}>
          {centros.map(({key, label, color}) => (
            <label key={key} style={{ ...C.btn(color), cursor:"pointer", fontSize:"11px", display:"inline-flex", alignItems:"center", gap:"6px" }}>
              📂 {label.toUpperCase()}
              <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}
                onChange={e => {
                  const file = e.target.files[0]; if (!file) return;
                  const reader = new FileReader();
                  reader.onload = ev => parseCentroXlsx(ev.target.result, key);
                  reader.readAsArrayBuffer(file);
                  e.target.value = "";
                }} />
            </label>
          ))}
        </div>

        {criticos.length === 0 && (
          <div style={{ color:"#606070", textAlign:"center", padding:"60px", fontSize:"14px" }}>
            Carga primero los stocks de Grela/Moras para ver las referencias críticas
          </div>
        )}

        {criticos.length > 0 && (
          <div style={{ overflow:"auto", maxHeight:"calc(100vh - 200px)" }}>
            <table style={{ borderCollapse:"collapse", fontSize:"12px", width:"100%" }}>
              <thead style={{ position:"sticky", top:0, zIndex:5 }}>
                {/* Row 1: section headers */}
                <tr style={{ background:"#202028", borderBottom:"1px solid #525260" }}>
                  <th colSpan={6} style={{ padding:"8px 10px", textAlign:"left", color:"#F3F4F6", fontWeight:700, fontSize:"11px" }}>Referencias críticas</th>
                  {centros.map(({key, label, color}) => (
                    <th key={key} colSpan={4} style={{ padding:"10px 14px", textAlign:"center", color:"#111", background:color+"CC", fontWeight:800, fontSize:"13px", borderLeft:"3px solid "+color, whiteSpace:"nowrap", letterSpacing:"0.06em" }}>
                      {label}{centrosFecha[key] && <div style={{ fontSize:"10px", fontWeight:400, marginTop:"2px", opacity:0.7 }}>{centrosFecha[key]}</div>}
                    </th>
                  ))}
                </tr>
                {/* Row 2: column labels */}
                <tr style={{ background:"#1A1A22", borderBottom:"2px solid #525260" }}>
                  <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:600, fontSize:"10px", whiteSpace:"nowrap", textAlign:"left" }}>Fábrica</th>
                  <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:600, fontSize:"10px", whiteSpace:"nowrap", textAlign:"left" }}>Código</th>
                  <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:600, fontSize:"10px", textAlign:"left", minWidth:"90px" }}>Descripción</th>
                  <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:600, fontSize:"10px", textAlign:"right", whiteSpace:"nowrap" }}>Diferencia</th>
                  <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:600, fontSize:"10px", textAlign:"center", whiteSpace:"nowrap", width:"60px" }}>PCK/CJ</th>
                  <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:600, fontSize:"10px", textAlign:"center", whiteSpace:"nowrap", width:"70px" }}>Uds/Pale</th>
                  {centros.map(({key, color}) => (
                    <React.Fragment key={key}>
                      <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:700, fontSize:"12px", textAlign:"center", borderLeft:"2px solid #525260", whiteSpace:"nowrap" }}>Libre</th>
                      <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:700, fontSize:"12px", textAlign:"center", whiteSpace:"nowrap" }}>Bloq.</th>
                      <th style={{ padding:"5px 8px", color:"#E5E7EB", fontWeight:700, fontSize:"12px", textAlign:"center", whiteSpace:"nowrap" }}>UMB</th>
                      <th style={{ padding:"5px 8px", color, fontWeight:700, fontSize:"10px", textAlign:"center", whiteSpace:"nowrap" }}>Pales</th>
                    </React.Fragment>
                  ))}
                </tr>
              </thead>
              <tbody>
                {criticos.map(({fac, r, clientes}, idx) => {
                  const inp = paleInputs[r.cod] || {};
                  const pck = parseFloat(inp.pckCj) || 0;
                  const uPale = parseFloat(inp.uPale) || 0;
                  // Get UMB from any centro that has this code
                  const umb = centrosData.ar2?.[r.cod]?.umb || centrosData.ar1?.[r.cod]?.umb || centrosData.moras?.[r.cod]?.umb || "";
                  const centrosLoaded = Object.values(centrosData).some(v => v !== null);
                  const hasMoras = fac.id !== "moras" && centrosData.moras?.[r.cod] && (centrosData.moras[r.cod].libre > 0 || centrosData.moras[r.cod].bloq > 0);
                  const hasAr2  = centrosData.ar2?.[r.cod]  && (centrosData.ar2[r.cod].libre  > 0 || centrosData.ar2[r.cod].bloq  > 0);
                  const hasAr1  = centrosData.ar1?.[r.cod]  && (centrosData.ar1[r.cod].libre  > 0 || centrosData.ar1[r.cod].bloq  > 0);
                  const hasAny = hasMoras || hasAr2 || hasAr1;
                  const rowBg = !hasAny && centrosLoaded ? "#1a0505" : idx%2===0 ? "#18181F" : "#0D0D12";

                  const renderCentroCell = (centroKey) => {
                    const available = !(centroKey === "moras" && fac.id === "moras");
                    const data = centrosData[centroKey]?.[r.cod];
                    const inp = paleInputs[r.cod] || {};
                    const pck = parseFloat(inp.pckCj) || 0;
                    const uPale = parseFloat(inp.uPale) || 0;
                    if (!available) return (
                      <React.Fragment key={centroKey}>
                        <td colSpan={4} style={{ padding:"5px 8px", textAlign:"center", color:"#3A3A4A", borderLeft:"2px solid #2A2A3A", fontSize:"11px" }}>—</td>
                      </React.Fragment>
                    );
                    const lib = data?.libre || 0;
                    const blq = data?.bloq  || 0;
                    const umb = data?.umb   || "";
                    const palesVal = data ? calcPales(lib, umb, pck, uPale) : null;
                    return (
                      <React.Fragment key={centroKey}>
                        <td style={{ padding:"5px 8px", textAlign:"center", color: lib>0?"#34D399":"#9CA3AF", fontWeight: lib>0?700:400, borderLeft:"2px solid #2A2A3A", fontFamily:"'DM Mono','Courier New',monospace", fontSize:"12px" }}>{lib.toLocaleString()}</td>
                        <td style={{ padding:"5px 8px", textAlign:"center", color: blq>0?"#F87171":"#9CA3AF", fontWeight: blq>0?700:400, fontFamily:"'DM Mono','Courier New',monospace", fontSize:"12px" }}>{blq.toLocaleString()}</td>
                        <td style={{ padding:"5px 8px", textAlign:"center", color:"#9CA3AF", fontSize:"10px", fontFamily:"'DM Mono','Courier New',monospace" }}>{umb||"—"}</td>
                        <td style={{ padding:"5px 8px", textAlign:"center", color: palesVal&&parseFloat(palesVal)>0?"#06B6D4":"#4B5563", fontWeight:700, fontFamily:"'DM Mono','Courier New',monospace", fontSize:"12px" }}>{palesVal||"—"}</td>
                      </React.Fragment>
                    );
                  };

                  return (
                    <tr key={idx} style={{ borderBottom:"1px solid #3A3A4F", background:rowBg }}>
                      <td style={{ padding:"5px 8px", whiteSpace:"nowrap" }}>
                        <span style={{ color:fac.color, fontWeight:700, fontSize:"12px" }}>{fac.label}</span>
                      </td>
                      <td style={{ padding:"5px 8px", whiteSpace:"nowrap" }}>
                        <span style={{ color: !hasAny && centrosLoaded ? "#F87171" : "#FFFFFF", fontWeight:700, fontFamily:"'DM Mono','Courier New',monospace", fontSize:"12px" }}>{r.cod}</span>
                        {!hasAny && centrosLoaded && <span style={{ marginLeft:"6px", fontSize:"10px", color:"#FF4444", fontWeight:700, background:"#3D0000", padding:"1px 5px", borderRadius:"3px", border:"1px solid #FF4444" }}>⚠ Sin alt.</span>}
                      </td>
                      <td style={{ padding:"5px 8px", color:"#D1D5DB", fontSize:"11px", maxWidth:"180px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{centrosData.ar2?.[r.cod]?.desc || centrosData.ar1?.[r.cod]?.desc || centrosData.moras?.[r.cod]?.desc || ""}</td>
                      <td style={{ padding:"5px 8px", textAlign:"right", color:"#EF4444", fontWeight:700, fontFamily:"'DM Mono','Courier New',monospace", fontSize:"12px", whiteSpace:"nowrap" }}>{(r.diff??0).toFixed(2)}</td>
                      <td style={{ padding:"3px 4px", textAlign:"center" }}>
                        <input type="number" min="1" placeholder="—"
                          style={{ background:"#1C1C2A", border:"1px solid #44444F", borderRadius:"4px", color:"#F3F4F6", fontSize:"11px", width:"50px", textAlign:"center", outline:"none", padding:"3px 4px", fontFamily:"inherit" }}
                          value={inp.pckCj||""}
                          onChange={e => setPaleInput(r.cod,"pckCj",e.target.value)} />
                      </td>
                      <td style={{ padding:"3px 4px", textAlign:"center" }}>
                        <input type="number" min="1" placeholder="—"
                          style={{ background:"#1C1C2A", border:"1px solid #44444F", borderRadius:"4px", color:"#F3F4F6", fontSize:"11px", width:"56px", textAlign:"center", outline:"none", padding:"3px 4px", fontFamily:"inherit" }}
                          value={inp.uPale||""}
                          onChange={e => setPaleInput(r.cod,"uPale",e.target.value)} />
                      </td>
                      {centros.map(({key}) => renderCentroCell(key))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

      {/* ── Disponibilidad de transportes en centros ── */}
      {(() => {
        const pm = dayData[activeFab]?.pedidosMap || {};
        const criticosCods = (dayData[activeFab]?.sapCriticos || []).map(r => r.cod);
        const centrosLoaded = Object.values(centrosData).some(v => v !== null);
        if (!centrosLoaded || !Object.keys(pm).length) return null;

        // Agrupar pedidos por transporte
        const transpMap = {};
        Object.entries(pm).forEach(([cod, peds]) => {
          peds.forEach(p => {
            const nt = String(p.transporte||"").trim();
            if (!nt) return;
            if (!transpMap[nt]) transpMap[nt] = { nTransp: nt, cliente: p.cliente||"", formatos: {} };
            transpMap[nt].formatos[cod] = (transpMap[nt].formatos[cod]||0) + (Number(p.qty)||0);
          });
        });

        // Solo transportes con al menos un formato crítico (o todos si no hay críticos)
        const transpCriticos = Object.values(transpMap).filter(t =>
          criticosCods.length === 0 || Object.keys(t.formatos).some(cod => criticosCods.includes(cod))
        ).sort((a,b) => a.nTransp.localeCompare(b.nTransp));

        if (!transpCriticos.length) return null;

        const centros3 = [
          { key:"moras", label:"Moras",       color:"#38BDF8" },
          { key:"ar1",   label:"Autoradio 1", color:"#A78BFA" },
          { key:"ar2",   label:"Autoradio 2", color:"#34D399" },
        ];

        const puedeServir = (centroKey, formatos) =>
          Object.entries(formatos).every(([cod, palesNec]) => {
            const stock = centrosData[centroKey]?.[cod];
            if (!stock) return false;
            const uPale = Number(paleInputs[cod]?.uPale) || null;
            return uPale ? Math.floor(stock.libre / uPale) >= palesNec : stock.libre > 0;
          });

        const faltantes = (centroKey, formatos) =>
          Object.entries(formatos)
            .filter(([cod, palesNec]) => {
              const stock = centrosData[centroKey]?.[cod];
              if (!stock) return true;
              const uPale = Number(paleInputs[cod]?.uPale) || null;
              return uPale ? Math.floor(stock.libre / uPale) < palesNec : stock.libre <= 0;
            })
            .map(([cod]) => cod);

        return (
          <div style={{ background:"#16161C", border:"1px solid #2A2A35", borderRadius:"10px", marginTop:"16px", overflow:"hidden" }}>
            <div style={{ background:"#1E1E28", padding:"12px 16px", borderBottom:"1px solid #2A2A35" }}>
              <div style={{ fontWeight:700, color:"#F3F4F6", fontSize:"14px" }}>🚛 Disponibilidad de transportes en centros</div>
              <div style={{ color:"#9CA3AF", fontSize:"11px", marginTop:"2px" }}>Transportes con formatos críticos — ✅ puede servirse completo desde ese centro · ❌ faltan formatos</div>
              <div style={{ marginTop:"10px", display:"flex", gap:"8px", alignItems:"center" }}>
                <input
                  type="text"
                  placeholder="Buscar nº transporte..."
                  value={busqTransp}
                  onChange={e => setBusqTransp(e.target.value)}
                  style={{ background:"#111116", border:"1px solid #3F3F46", borderRadius:"6px", color:"#F3F4F6", padding:"6px 12px", fontSize:"12px", outline:"none", fontFamily:"inherit", width:"200px" }}
                />
                {busqTransp && <button onClick={() => setBusqTransp("")} style={{ background:"none", border:"none", color:"#9CA3AF", cursor:"pointer", fontSize:"12px", fontFamily:"inherit" }}>✕ Limpiar</button>}
              </div>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", minWidth:"600px" }}>
                <thead>
                  <tr style={{ background:"#111118" }}>
                    <th style={{ padding:"8px 12px", textAlign:"left",  color:"#9CA3AF", fontSize:"11px", fontWeight:700, borderBottom:"2px solid #2A2A35" }}>Transporte</th>
                    <th style={{ padding:"8px 12px", textAlign:"left",  color:"#9CA3AF", fontSize:"11px", fontWeight:700, borderBottom:"2px solid #2A2A35" }}>Cliente</th>
                    <th style={{ padding:"8px 12px", textAlign:"center",color:"#9CA3AF", fontSize:"11px", fontWeight:700, borderBottom:"2px solid #2A2A35" }}>Formatos críticos</th>
                    {centros3.map(({key,label,color}) => (
                      <th key={key} style={{ padding:"8px 12px", textAlign:"center", color, fontSize:"11px", fontWeight:700, borderBottom:"2px solid #2A2A35", width:"110px" }}>{label}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {transpCriticos.filter(t =>
                    !busqTransp || t.nTransp.includes(busqTransp.trim()) || t.cliente.toUpperCase().includes(busqTransp.toUpperCase().trim())
                  ).map((t, idx) => {
                    const formatosCriticos = Object.keys(t.formatos).filter(cod => criticosCods.includes(cod));
                    return (
                      <tr key={t.nTransp} style={{ background: idx%2===0 ? "#16161C" : "#1A1A24", borderBottom:"1px solid #1E1E2A" }}>
                        <td style={{ padding:"4px 8px", color:"#D946EF", fontWeight:700, fontSize:"11px", fontFamily:"'DM Mono',monospace" }}>{t.nTransp}</td>
                        <td style={{ padding:"4px 8px", color:"#E5E7EB", fontSize:"11px", maxWidth:"200px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{t.cliente}</td>
                        <td style={{ padding:"4px 8px", textAlign:"center" }}>
                          <div style={{ display:"flex", gap:"3px", flexWrap:"wrap", justifyContent:"center" }}>
                            {formatosCriticos.map(cod => (
                              <span key={cod} style={{ background:"#7f1d1d22", border:"1px solid #ef444444", borderRadius:"4px", padding:"1px 5px", fontSize:"10px", color:"#fca5a5", fontFamily:"'DM Mono',monospace" }}>{cod}</span>
                            ))}
                          </div>
                        </td>
                        {centros3.map(({key}) => {
                          const puede = puedeServir(key, t.formatos);
                          const falt  = puede ? [] : faltantes(key, t.formatos);
                          return (
                            <td key={key} style={{ padding:"4px 8px", textAlign:"center" }}>
                              {!centrosData[key]
                                ? <span style={{ color:"#3F3F46", fontSize:"11px" }}>—</span>
                                : <span style={{ fontSize:"16px" }} title={puede ? "Puede servirse completo" : `Faltan: ${falt.join(", ")}`}>
                                    {puede ? "✅" : "❌"}
                                  </span>
                              }
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}
      </div>
    );
  };

  const renderPlanificacion = () => (
    <div style={{ padding:"0 4px" }}>
      {/* Header fijo */}
      <div style={{ display:"flex", alignItems:"center", gap:"14px", marginBottom:"16px", flexWrap:"wrap", position:"sticky", top:0, zIndex:10, background:"#111116", padding:"10px 0", borderBottom:"1px solid #1E1E2A" }}>
        <label style={{ ...C.btn("#10B981"), cursor:"pointer", display:"inline-block", fontSize:"12px" }}>
          📂 CARGAR PLANIFICACIÓN
          <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}
            onChange={e => {
              const file = e.target.files[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = ev => parsePlanXlsx(ev.target.result);
              reader.readAsArrayBuffer(file);
              e.target.value = "";
            }} />
        </label>
        {planFecha[activeFab] && <span style={{ fontSize:"11px", color:"#6ee7a0" }}>Cargado {planFecha[activeFab]} · {planData[activeFab].length} turnos</span>}
      </div>

      {planData[activeFab].length === 0 && (
        <div style={{ color:"#606070", textAlign:"center", padding:"60px", fontSize:"14px" }}>
          Carga el archivo Excel de planificación de envasado
        </div>
      )}

      {planData[activeFab].length > 0 && (() => {
        // Group by grupo
        const byGrupo = {};
        planData[activeFab].forEach(p => {
          if (!byGrupo[p.grupo]) byGrupo[p.grupo] = [];
          byGrupo[p.grupo].push(p);
        });
        // Get critical codes from active factory only
        const criticosCodes = new Set(
          (dayData[activeFab]?.sapCriticos||[]).map(r=>r.cod)
        );

        return (
          <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
            {Object.entries(byGrupo).map(([grupo, turnos]) => (
              <div key={grupo} style={{ background:"#1A1A1F", border:"1px solid #44444F", borderRadius:"8px", overflow:"hidden" }}>
                <div style={{ background:"#202028", padding:"8px 14px", fontWeight:700, color:"#10B981", fontSize:"12px", letterSpacing:"0.06em" }}>
                  {grupo}
                </div>
                <table style={{ borderCollapse:"collapse", fontSize:"12px", tableLayout:"fixed", width:"auto", minWidth:"100%" }}>
                  <thead>
                    <tr style={{ background:"#16161C" }}>
                      {[
                        {h:"Día",w:"42px"},{h:"Código",w:"58px"},{h:"Descripción",w:"280px"},{h:"Inicio",w:"90px"},{h:"Fin",w:"90px"}
                      ].map(({h,w}) => <th key={h} style={{ padding:"5px 8px", textAlign:"left", color:"#9CA3AF", fontWeight:600, fontSize:"11px", width:w }}>{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {turnos.map((t,ti) => {
                      const esCritico = criticosCodes.has(t.cod);
                      return (
                        <tr key={ti} style={{ borderBottom:"1px solid #2A2A35", background: esCritico ? "#1a0f00" : "transparent" }}>
                          <td style={{ padding:"4px 8px", color:"#9CA3AF", whiteSpace:"nowrap", fontSize:"11px" }}>{t.dia}</td>
                          <td style={{ padding:"4px 8px", color: esCritico ? "#D946EF" : "#FFFFFF", fontWeight: esCritico ? 700 : 400, fontSize:"11px" }}>{t.cod}</td>
                          <td style={{ padding:"4px 8px", color:"#E5E7EB", fontSize:"11px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{t.desc}</td>
                          <td style={{ padding:"4px 8px", color:"#6ee7a0", whiteSpace:"nowrap", fontWeight:600, fontSize:"11px" }}>{t.hi}</td>
                          <td style={{ padding:"4px 8px", color:"#fca5a5", whiteSpace:"nowrap", fontSize:"11px" }}>{t.hf}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );

  const renderGeneric = (secId) => (
    <div style={C.row}>
      {FACTORIES.map(fac => (
        <FactoryPanel key={fac.id} factory={fac}>
          <input style={{ ...C.input, marginBottom:"6px" }} placeholder="Título / Referencia..."
            value={entry[fac.id].titulo} onChange={e => setEntry(p => ({ ...p, [fac.id]: { ...p[fac.id], titulo: e.target.value } }))} />
          <textarea style={{ ...C.textarea, marginBottom:"6px" }} placeholder="Descripción..."
            value={entry[fac.id].texto} onChange={e => setEntry(p => ({ ...p, [fac.id]: { ...p[fac.id], texto: e.target.value } }))} />
          <button style={C.btn(fac.color)} onClick={() => addEntry(secId, fac.id)}>+ AÑADIR</button>
          <EntryList entries={dayData[fac.id]?.[secId]} onDelete={i => deleteEntry(secId, fac.id, i)} color={fac.color} />
        </FactoryPanel>
      ))}
    </div>
  );

  const renderResumen = () => {
    const savedAt = dayData._resumenGuardado;
    const guardarResumen = async () => {
      const snap = JSON.parse(JSON.stringify(dayData));
      snap._resumenGuardado = new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
            showSaved("✓ Resumen guardado " + snap._resumenGuardado);
    };
    return (
      <div>
        <div style={{ display:"flex", alignItems:"center", gap:"14px", marginBottom:"16px", padding:"12px 16px", background:"#202028", borderRadius:"10px", border:"1px solid #44444F" }}>
          <button onClick={guardarResumen} style={{ background:"#A3E635", border:"none", color:"#111", borderRadius:"8px", padding:"10px 24px", cursor:"pointer", fontWeight:800, fontSize:"13px", letterSpacing:"0.06em", fontFamily:"inherit" }}>
            💾 GUARDAR RESUMEN
          </button>
          {savedAt
            ? <span style={{ color:"#A3E635", fontSize:"12px", fontWeight:600 }}>✓ Guardado a las {savedAt}</span>
            : <span style={{ color:"#606070", fontSize:"12px" }}>Pulsa para guardar una instantánea del día</span>
          }
        </div>
        <div style={C.row}>
          {FACTORIES.map(fac => {
            const fd = dayData[fac.id] || {};
            const hasMeta   = fd.transporteMeta && (fd.transporteMeta && Object.values(fd.transporteMeta).some(Boolean));
            const hasStocks = fd.stocksMeta     && (fd.stocksMeta && Object.values(fd.stocksMeta).some(Boolean));
            const hasEnt    = ENTRY_SECTIONS.some(s => fd[s]?.length > 0);
            return (
              <div key={fac.id} style={{ flex:1, minWidth:0, background:"#161620", border:`1px solid ${fac.color}44`, borderTop:`2px solid ${fac.color}`, borderRadius:"12px", padding:"16px" }}>
                <div style={{ fontWeight:700, color:fac.color, fontSize:"13px", marginBottom:"14px", textTransform:"uppercase", letterSpacing:"0.08em" }}>
                  🏭 {fac.label} — {formatDate(selectedDate)}
                </div>
                {!hasMeta && !hasStocks && !hasEnt && <p style={{ color:"#F9FAFB", fontStyle:"italic", fontSize:"12px" }}>Sin datos registrados.</p>}

                {/* Transport */}
                {(hasMeta || fd.transporte?.length > 0 || fd.pendientesLista?.length > 0) && (
                  <div style={{ marginBottom:"12px" }}>
                    <div style={{ fontSize:"10px", fontWeight:700, color:"#D946EF", textTransform:"uppercase", marginBottom:"6px" }}>🚛 Transporte</div>
                    <div style={{ display:"flex", gap:"8px", marginBottom:"6px", flexWrap:"wrap" }}>
                      {[["Totales",fd.transporteMeta?.totales],["Pendientes",fd.transporteMeta?.pendientes],["Nocturnas",fd.transporteMeta?.nocturnas]].map(([lbl,val]) => val ? (
                        <div key={lbl} style={{ background:"#16161C", borderRadius:"6px", padding:"5px 10px", textAlign:"center" }}>
                          <div style={{ fontSize:"9px", color:"#F9FAFB" }}>{lbl}</div>
                          <div style={{ fontSize:"20px", fontWeight:700, color:"#D946EF" }}>{val}</div>
                        </div>
                      ) : null)}
                    </div>
                    {fd.transporteMeta?.notas && <div style={{ color:"#FFFFFF", fontSize:"12px", marginBottom:"4px" }}>{fd.transporteMeta.notas}</div>}
                    {(fd.transporte||[]).map((e,i) => (
                      <div key={i} style={{ borderBottom:"1px solid #44444F", padding:"3px 0", color:"#FFFFFF", fontSize:"12px" }}>
                        {e.titulo && <strong>{e.titulo}: </strong>}{e.texto}
                      </div>
                    ))}
                    {fd.pendientesLista?.length > 0 && (
                      <div style={{ marginTop:"6px" }}>
                        <div style={{ fontSize:"10px", color:"#9CA3AF", marginBottom:"6px" }}>CAMIONES PENDIENTES</div>
                        <div style={{ display:"flex", gap:"10px", flexWrap:"wrap", alignItems:"flex-start" }}>
                          {fd.pendientesLista.map((item,idx) => (
                            <div key={idx} style={{ flex:"1 1 300px", minWidth:0 }}>
                              {item.titulo && <div style={{ color:"#D946EF", fontWeight:700, fontSize:"11px", marginBottom:"3px" }}>{item.titulo} <span style={{ color:"#9CA3AF", fontWeight:400 }}>{item.hora}</span></div>}
                              {item.tipo==="img" && <img src={item.data} style={{ maxWidth:"100%", borderRadius:"4px" }} />}
                              {item.tipo==="tabla" && (
                                <div style={{ overflowX:"auto" }}>
                                  <table style={{ borderCollapse:"collapse", fontSize:"11px" }}>
                                    <tbody>
                                      {item.data.map((row,ri) => (
                                        <tr key={ri} style={{ borderBottom:"1px solid #36363F", background:ri%2===0?"#13131A":"transparent" }}>
                                          {row.map((cell,ci) => <td key={ci} style={{ padding:"2px 4px", color:"#FFFFFF", whiteSpace:"nowrap", fontSize:"11px" }}>{cell}</td>)}

                                      ))}
                                    </tbody>
                                  </table>
                                </div>

  const renderHistorico = () => {
    if (histLoading) return <div style={{ textAlign:"center", color:"#F9FAFB", padding:"60px" }}>Cargando histórico...</div>;
    if (!histDays.length) return <div style={{ textAlign:"center", color:"#F9FAFB", padding:"60px", fontStyle:"italic" }}>No hay datos guardados aún.</div>;

    const renderList = () => (
      <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
        {histDays.map(({ date, data }) => {
          const totalE = FACTORIES.reduce((n,f) => n + ENTRY_SECTIONS.reduce((m,s) => m + (data[f.id]?.[s]?.length||0), 0), 0);
          return (
            <div key={date} onClick={() => { setSelectedDate(date); setActiveSection("resumen"); }}
              style={{ background:"#202028", border:"1px solid #44444F", borderRadius:"8px", padding:"10px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:"12px" }}>
              <div style={{ fontWeight:700, color: date===todayStr()?"#D946EF":"#E5E7EB", fontSize:"13px", minWidth:"90px" }}>

              </div>
              <div style={{ display:"flex", gap:"8px", flex:1, flexWrap:"wrap" }}>
                {FACTORIES.map(fac => {

            </div>
          );

      </div>
    );

    const renderSearch = () => {
      const q = searchQ.toLowerCase().trim();
      if (!q) return <p style={{ color:"#F9FAFB", fontSize:"12px", fontStyle:"italic" }}>Escribe algo para buscar entre todas las anotaciones.</p>;
      const results = [];
      histDays.forEach(({ date, data }) => {
        FACTORIES.forEach(fac => {
          const fd = data[fac.id]||{};
          ENTRY_SECTIONS.forEach(secId => {
            (fd[secId]||[]).forEach(e => {
              if (`${e.titulo||""} ${e.texto||""}`.toLowerCase().includes(q)) {
                results.push({ date, fac, sec: SECTIONS.find(s=>s.id===secId), e });

            });
          });
          if (fd.transporteMeta?.notas?.toLowerCase().includes(q))
            results.push({ date, fac, sec: SECTIONS[0], e: { titulo:"Nota transporte", texto: fd.transporteMeta.notas, hora:"" } });
        });
      });
      if (!results.length) return <p style={{ color:"#F9FAFB", fontSize:"12px", fontStyle:"italic" }}>Sin resultados para "{searchQ}".</p>;
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
          <div style={{ fontSize:"11px", color:"#F9FAFB", marginBottom:"4px" }}>{results.length} resultado{results.length!==1?"s":""}</div>
          {results.map((r,i) => (
            <div key={i} style={{ background:"#202028", border:"1px solid #44444F", borderLeft:`3px solid ${r.fac.color}`, borderRadius:"6px", padding:"8px 12px" }}>
              <div style={{ display:"flex", gap:"8px", alignItems:"center", marginBottom:"4px" }}>
                <span style={{ fontSize:"10px", fontWeight:700, color:r.fac.color }}>{r.fac.label}</span>
                <span style={{ fontSize:"10px", color:r.sec.color }}>{r.sec.icon} {r.sec.label}</span>
                <span style={{ fontSize:"10px", color:"#F9FAFB", marginLeft:"auto" }}>{formatDate(r.date)}</span>
              </div>

              {r.e.texto  && <div style={{ color:"#FFFFFF", fontSize:"12px" }}>{r.e.texto}</div>}
            </div>
          ))}
        </div>
      );
    };

    const renderCompare = (groupFn, label) => {
      const groups = {};
      histDays.forEach(({ date, data }) => {
        const key = groupFn(date);
        if (!groups[key]) groups[key] = [];
        groups[key].push({ date, data });
      });
      return (
        <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
          {Object.keys(groups).sort((a,b) => b.localeCompare(a)).map(gKey => {
            const days = groups[gKey];
            const gLabel = label==="semana"
              ? `Sem. ${formatDate(gKey.split("__")[0])} – ${formatDate(gKey.split("__")[1])}`
              : (() => { const [y,m]=gKey.split("-"); return `${["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][+m]} ${y}`; })();
            return (
              <div key={gKey} style={{ background:"#202028", border:"1px solid #44444F", borderRadius:"10px", overflow:"hidden" }}>
                <div style={{ background:"#1E1E21", padding:"8px 14px", fontSize:"11px", fontWeight:700, color:"#E879F9", textTransform:"uppercase", letterSpacing:"0.08em" }}>{gLabel}</div>
                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
                    <thead>
                      <tr style={{ borderBottom:"1px solid #44444F" }}>
                        <th style={{ padding:"6px 12px", textAlign:"left", color:"#F9FAFB", fontWeight:600, whiteSpace:"nowrap" }}>Fecha</th>
                        {FACTORIES.map(fac => (<React.Fragment key={fac.id}>
                          <th style={{ padding:"6px 8px", color:fac.color, fontWeight:700, whiteSpace:"nowrap" }}>{fac.label} 🚛C</th>
                          <th style={{ padding:"6px 8px", color:`${fac.color}99`, fontWeight:600, whiteSpace:"nowrap" }}>Pend.</th>
                          <th style={{ padding:"6px 8px", color:`${fac.color}66`, fontWeight:600, whiteSpace:"nowrap" }}>Noct.</th>
                          <th style={{ padding:"6px 8px", color:"#F9FAFB", fontWeight:600, whiteSpace:"nowrap" }}>Inc.</th>
                        </React.Fragment>))}
                      </tr>
                    </thead>
                    <tbody>
                      {days.map(({ date, data }) => (
                        <tr key={date} onClick={() => { setSelectedDate(date); setActiveSection("resumen"); }} style={{ borderBottom:"1px solid #1E1E21", cursor:"pointer" }}>
                          <td style={{ padding:"6px 12px", color:"#FFFFFF", whiteSpace:"nowrap" }}>{formatDate(date)}</td>
                          {FACTORIES.map(fac => {
                            const tm = data[fac.id]?.transporteMeta||{};
                            const inc = ENTRY_SECTIONS.reduce((n,s) => n+(data[fac.id]?.[s]?.length||0), 0);
                            return (<React.Fragment key={fac.id}>
                              <td style={{ padding:"6px 8px", textAlign:"center", color:"#D946EF", fontWeight:700 }}>{tm.cargados||"—"}</td>
                              <td style={{ padding:"6px 8px", textAlign:"center", color:"#FFFFFF" }}>{tm.pendientes||"—"}</td>
                              <td style={{ padding:"6px 8px", textAlign:"center", color:"#FFFFFF" }}>{tm.nocturnas||"—"}</td>
                              <td style={{ padding:"6px 8px", textAlign:"center", color: inc>0?"#F97316":"#52525B" }}>{inc||"—"}</td>
                            </React.Fragment>);
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    return (
      <div>
        <div style={{ display:"flex", gap:"8px", marginBottom:"16px", flexWrap:"wrap", alignItems:"center" }}>
          {[["list","📋 Listado"],["semana","📆 Por semana"],["mes","🗓 Por mes"],["search","🔍 Buscar"]].map(([v,lbl]) => (
            <button key={v} onClick={() => setHistView(v)} style={histView===v ? C.btn("#E879F9") : C.btnO("#E879F9")}>{lbl}</button>
          ))}
          <div style={{ marginLeft:"auto" }}>
            <button onClick={() => exportCSV(histDays)} style={C.btnO("#A3E635")}>⬇ Exportar CSV</button>
          </div>
        </div>
        {histView==="search" && (
          <div style={{ marginBottom:"14px" }}>
            <input style={{ ...C.input, fontSize:"14px", padding:"10px 14px" }} placeholder="Buscar en todas las anotaciones..."
              value={searchQ} onChange={e => setSearchQ(e.target.value)} autoFocus />
          </div>
        )}
        {histView==="list"   && renderList()}
        {histView==="semana" && renderCompare(weekOf,"semana")}
        {histView==="mes"    && renderCompare(monthOf,"mes")}
        {histView==="search" && renderSearch()}
      </div>
    );
  };

  // ── Firebase sync ─────────────────────────────────────────────────
  const todayKey = todayStr();
  const [fbReady, setFbReady] = useState(false);

  // Guardar en Firestore
  const fbSet = async (docId, data) => {
    try {
      if (!window.__db) return;
      await window.__fsSetDoc(window.__fsDoc(window.__db, "diario", docId), data, { merge: true });
    } catch(e) { console.warn("Firebase write error:", e); }
  };

  // Cargar desde Firestore al arrancar
  React.useEffect(() => {
    const init = async () => {
      if (!window.__db) return;
      try {
        // Cargar datos compartidos del día
        const snap = await window.__fsGetDoc(window.__fsDoc(window.__db, "diario", `shared_${todayKey}`));
        if (snap.exists()) {
          const d = snap.data();
          if (d.incidenciasCamion) {
            // Merge en dayData
            setDayData(prev => ({
              agrela: { ...prev.agrela, incidenciasCamion: { ...(prev.agrela.incidenciasCamion||{}), ...(d.incidenciasCamion?.agrela||{}) }},
              moras:  { ...prev.moras,  incidenciasCamion: { ...(prev.moras.incidenciasCamion||{}),  ...(d.incidenciasCamion?.moras||{})  }},
            }));
          }
          if (d.palesReales) setPalesReales(d.palesReales);
          if (d.roturasIgnoradas) setRoturasIgnoradas(d.roturasIgnoradas);
          if (d.pesosIgnorados) setPesosIgnorados(d.pesosIgnorados);
          if (d.llenado) {
            setDayData(prev => ({
              agrela: { ...prev.agrela, llenado: { ...(prev.agrela.llenado||{}), ...(d.llenado?.agrela||{}) }},
              moras:  { ...prev.moras,  llenado: { ...(prev.moras.llenado||{}),  ...(d.llenado?.moras||{})  }},
            }));
          }
        }
        // Suscribir a cambios en tiempo real
        window.__fsOnSnapshot(window.__fsDoc(window.__db, "diario", `shared_${todayKey}`), (snap) => {
          if (!snap.exists()) return;
          const d = snap.data();
          if (d._from === window.__localId) return; // ignorar propios cambios
          if (d.incidenciasCamion) {
            setDayData(prev => ({
              agrela: { ...prev.agrela, incidenciasCamion: { ...(prev.agrela.incidenciasCamion||{}), ...(d.incidenciasCamion?.agrela||{}) }},
              moras:  { ...prev.moras,  incidenciasCamion: { ...(prev.moras.incidenciasCamion||{}),  ...(d.incidenciasCamion?.moras||{})  }},
            }));
          }
          if (d.palesReales) setPalesReales(d.palesReales);
          if (d.roturasIgnoradas) setRoturasIgnoradas(d.roturasIgnoradas);
          if (d.pesosIgnorados) setPesosIgnorados(d.pesosIgnorados);
          if (d.llenado) {
            setDayData(prev => ({
              agrela: { ...prev.agrela, llenado: { ...(prev.agrela.llenado||{}), ...(d.llenado?.agrela||{}) }},
              moras:  { ...prev.moras,  llenado: { ...(prev.moras.llenado||{}),  ...(d.llenado?.moras||{})  }},
            }));
          }
        });
        setFbReady(true);
      } catch(e) { console.warn("Firebase init error:", e); }
    };
    if (window.__firebaseReady) init();
    else window.addEventListener("firebase-ready", init, { once: true });
  }, []);

  // Asignar ID local único
  if (!window.__localId) window.__localId = Math.random().toString(36).slice(2);

  // Función para sincronizar datos compartidos a Firebase
  const fbSync = (patch) => {
    fbSet(`shared_${todayKey}`, { ...patch, _from: window.__localId, _ts: Date.now() });
  };
  const CamionPopup = () => {
    if (!camionPopup) return null;
    const { c, fid } = camionPopup;
    const pm = dayData[fid]?.pedidosMap || {};
    const sm = dayData[fid]?.sapStockMap || {};
    const criticos = (dayData[fid]?.sapCriticos || []).map(r => r.cod);
    const formatosDelTransp = [];
    Object.entries(pm).forEach(([cod, peds]) => {
      const pedCamion = peds.filter(p => String(p.transporte||"").trim() === c.nTransp);
      if (!pedCamion.length) return;
      const totalQty = pedCamion.reduce((s,p) => s + (Number(p.qty)||0), 0);
      const stock = sm[cod] || {};
      const udsXPale = productos.find(p => p.cod === cod)?.udsPale || null;
      const palesQty = udsXPale ? (totalQty / udsXPale).toFixed(1) : "—";
      const esCritico = criticos.includes(cod);
      formatosDelTransp.push({ cod, totalQty, palesQty, stock, esCritico, clientes: pedCamion });
    });
    formatosDelTransp.sort((a,b) => {
      const aLetra = /^[A-Za-z]/.test(a.cod);
      const bLetra = /^[A-Za-z]/.test(b.cod);
      if (aLetra !== bLetra) return aLetra ? 1 : -1;
      return a.cod.localeCompare(b.cod, undefined, { numeric: true });
    });
    const soloRotura = formatosDelTransp.filter(f => f.esCritico);
    const colNum = (() => {
      if (!c.fechaEnt) return "#9CA3AF";
      const [d,m,y] = c.fechaEnt.split("/");
      const fecha = new Date(`20${y}-${m}-${d}`);
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const diff = Math.round((fecha-hoy)/86400000);
      if (diff<0) return "#ef4444"; if (diff===0) return "#4ade80"; if (diff===1) return "#38BDF8"; return "#fb923c";
    })();
    return (
      <div onClick={() => setCamionPopup(null)} style={{ position:"fixed", inset:0, background:"#000000BB", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
        <div onClick={e => e.stopPropagation()} style={{ background:"#16161C", border:"1px solid #2A2A35", borderRadius:"12px", width:"100%", maxWidth:"720px", maxHeight:"80vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 64px #000" }}>
          {/* Header */}
          <div style={{ padding:"16px 20px", borderBottom:"1px solid #2A2A35", display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:"12px" }}>
            <div>
              <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"4px", flexWrap:"wrap" }}>
                <span style={{ color:colNum, fontWeight:900, fontSize:"20px", fontFamily:"'JetBrains Mono','DM Mono',monospace" }}>{c.nTransp}</span>
                {formatosDelTransp.some(f=>f.esCritico) && (
                  <>
                    <span style={{ background:"#7f1d1d", color:"#fca5a5", borderRadius:"6px", padding:"2px 8px", fontSize:"11px", fontWeight:700 }}>🚨 Formatos en rotura</span>
                    {!isRoturaIgnorada(fid, c.nTransp)
                      ? <button onClick={e => { e.stopPropagation(); ignorarRotura(fid, c.nTransp); }} style={{ background:"#2D2D3A", border:"1px solid #3F3F46", color:"#9CA3AF", borderRadius:"6px", padding:"2px 8px", fontSize:"10px", cursor:"pointer", fontFamily:"inherit" }}>Quitar icono</button>
                      : <button onClick={e => { e.stopPropagation(); quitarIgnorarRotura(fid, c.nTransp); }} style={{ background:"#2D2D3A", border:"1px solid #3F3F46", color:"#38BDF8", borderRadius:"6px", padding:"2px 8px", fontSize:"10px", cursor:"pointer", fontFamily:"inherit" }}>Restaurar icono</button>
                    }
                  </>
                )}
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:"8px" }}>
                <div style={{ color:"#F3F4F6", fontWeight:700, fontSize:"16px" }}>{c.cliente}</div>
                {c.poblacion && (
                  <div style={{ display:"flex", alignItems:"center", gap:"6px" }}>
                    <span style={{ color:"#D1D5DB", fontSize:"13px" }}>📍 {c.poblacion}</span>
                    <button onClick={e => { e.stopPropagation(); setMapPopup(c.poblacion); }}
                      style={{ background:"#1E3A5F", border:"1px solid #38BDF844", borderRadius:"6px", color:"#38BDF8", padding:"2px 8px", cursor:"pointer", fontSize:"11px", fontWeight:700, fontFamily:"inherit", lineHeight:1.4 }}>
                      🗺️ Ver mapa
                    </button>
                  </div>
                )}
              </div>
              <div style={{ color:"#9CA3AF", fontWeight:500, fontSize:"16px" }}>{c.transport}</div>
              {(c.tractora || c.remolque) && (
                <div style={{ display:"flex", gap:"16px", marginTop:"2px" }}>
                  {c.tractora && <span style={{ color:"#6B7280", fontSize:"12px" }}>TRACTORA: <span style={{ color:"#D1D5DB", fontWeight:600 }}>{c.tractora}</span></span>}
                  {c.remolque && <span style={{ color:"#6B7280", fontSize:"12px" }}>REMOLQUE: <span style={{ color:"#D1D5DB", fontWeight:600 }}>{c.remolque}</span></span>}
                </div>
              )}
              <div style={{ display:"flex", gap:"16px", marginTop:"6px", flexWrap:"wrap", alignItems:"center" }}>
                {c.inicio && (() => {
                  const hi = c.inicio.includes("-") ? c.inicio.split("-").pop() : c.inicio;
                  const hf = c.fin ? (c.fin.includes("-") ? c.fin.split("-").pop() : c.fin) : null;
                  return (
                    <div style={{ display:"flex", alignItems:"center", gap:"5px" }}>
                      <span style={{ fontSize:"12px", color:"#9CA3AF", fontWeight:600 }}>TRAMO CARGA</span>
                      <span style={{ fontSize:"14px", color:"#E5E7EB", fontWeight:700 }}>🕐 {hi}{hf ? ` → ${hf}` : ""}</span>
                    </div>
                  );
                })()}
                {c.fechaCarga && (
                  <div style={{ display:"flex", alignItems:"center", gap:"5px" }}>
                    <span style={{ fontSize:"12px", color:"#9CA3AF", fontWeight:600 }}>F. CARGA</span>
                    <span style={{ fontSize:"14px", color:"#E5E7EB", fontWeight:700 }}>📅 {c.fechaCarga}</span>
                  </div>
                )}
                {c.fechaEnt && (
                  <div style={{ display:"flex", alignItems:"center", gap:"5px" }}>
                    <span style={{ fontSize:"12px", color:"#9CA3AF", fontWeight:600 }}>ENTREGA</span>
                    <span style={{ fontSize:"14px", color:"#E5E7EB", fontWeight:700 }}>📅 {c.fechaEnt}</span>
                  </div>
                )}
                {c.peso && (() => {
                  const excedido = isPesoExcedido(c, fid);
                  const ignorado = isPesoIgnorado(fid, c.nTransp);
                  const max = getPesoMaxAgencia(c.transport);
                  return (
                    <div style={{ display:"flex", alignItems:"center", gap:"5px", flexWrap:"wrap" }}>
                      <span style={{ fontSize:"12px", color:"#9CA3AF", fontWeight:600 }}>PESO</span>
                      <span style={{ fontSize:"14px", color: excedido ? "#ef4444" : "#E5E7EB", fontWeight:700 }}>⚖️ {c.peso}</span>
                      {excedido && <span style={{ background:"#7f1d1d", color:"#fca5a5", borderRadius:"4px", padding:"1px 6px", fontSize:"12px", fontWeight:700 }}>⚠️ Máx. {max?.toLocaleString("es-ES")} KG</span>}
                      {excedido && <button onClick={e => { e.stopPropagation(); ignorarPesoAlerta(fid, c.nTransp); }} style={{ background:"#2D2D3A", border:"1px solid #3F3F46", color:"#9CA3AF", borderRadius:"4px", padding:"1px 8px", fontSize:"11px", cursor:"pointer", fontFamily:"inherit" }}>Quitar alerta</button>}
                      {ignorado && <span style={{ color:"#52525B", fontSize:"10px" }}>⚠️ Alerta ignorada <button onClick={e => { e.stopPropagation(); quitarIgnorarPeso(fid, c.nTransp); }} style={{ background:"none", border:"none", color:"#38BDF8", fontSize:"10px", cursor:"pointer", fontFamily:"inherit", padding:0 }}>Restaurar</button></span>}
                    </div>
                  );
                })()}
              </div>
            </div>
            <button onClick={() => setCamionPopup(null)} style={{ background:"#2A2A35", border:"none", color:"#9CA3AF", borderRadius:"6px", padding:"6px 12px", cursor:"pointer", fontSize:"16px", flexShrink:0 }}>✕</button>
          </div>
          {/* Incidencias */}
          {(() => {
            const incids = getIncidencias(fid, c.nTransp);
            const toggleIncid = (tipo) => {
              const existe = incids.findIndex(i => i.tipo === tipo);
              let nueva;
              if (existe >= 0) {
                nueva = incids.filter((_,i) => i !== existe);
              } else {
                if (incids.length >= 3) return; // máx 3
                nueva = [...incids, { tipo, hora:"" }];
              }
              setIncidencias(fid, c.nTransp, nueva);
            };
            const setHora = (tipo, hora) => {
              setIncidencias(fid, c.nTransp, incids.map(i => i.tipo===tipo ? {...i, hora} : i));
            };
            return (
              <div style={{ padding:"10px 20px", borderBottom:"1px solid #2A2A35", background:"#0e0e14" }}>
                <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px" }}>
                  <div style={{ fontSize:"10px", color:"#9CA3AF", fontWeight:700, letterSpacing:"0.08em" }}>INCIDENCIAS</div>
                  <div style={{ fontSize:"10px", color:"#52525B" }}>máx. 3</div>
                </div>
                <div style={{ display:"flex", gap:"6px", flexWrap:"wrap" }}>
                  {incidenciasConfig.map(inc => {
                    const activa = incids.find(i => i.tipo === inc.id);
                    const bloqueada = !activa && incids.length >= 3;
                    return (
                      <div key={inc.id} style={{ display:"flex", flexDirection:"column", gap:"4px" }}>
                        <button onClick={e => { e.stopPropagation(); toggleIncid(inc.id); }}
                          style={{ background: activa ? "#1a3a1a" : "#1A1A24", border: `1px solid ${activa ? "#22C55E" : "#3F3F46"}`, borderRadius:"8px", color: activa ? "#4ade80" : bloqueada ? "#3F3F46" : "#E5E7EB", padding:"6px 12px", cursor: bloqueada ? "not-allowed" : "pointer", fontSize:"12px", fontWeight: activa ? 700 : 400, fontFamily:"inherit", display:"flex", alignItems:"center", gap:"6px", opacity: bloqueada ? 0.4 : 1 }}>
                          <span style={{ fontSize:"18px" }}>{inc.icon}</span>
                          {inc.label}
                          {activa && <span style={{ fontSize:"10px", color:"#4ade80" }}>✓</span>}
                        </button>
                        {activa && inc.conHora && (
                          <input type="time" value={activa.hora||""} onClick={e=>e.stopPropagation()}
                            onChange={e => setHora(inc.id, e.target.value)}
                            style={{ background:"#1A1A24", border:"1px solid #3F3F46", borderRadius:"6px", color:"#E5E7EB", padding:"4px 8px", fontSize:"11px", fontFamily:"inherit", outline:"none", width:"100px" }} />
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}
          {/* No optimizado */}
          {c.optimizada === false && (
            <div style={{ padding:"8px 20px", borderBottom:"1px solid #2A2A35", background:"#1a0a0a", display:"flex", alignItems:"center", gap:"10px" }}>
              <span style={{ fontSize:"18px", lineHeight:1, filter:"saturate(0) brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5) brightness(1.2)" }}>⚙️</span>
              <span style={{ color:"#fca5a5", fontWeight:700, fontSize:"12px" }}>Carga no optimizada</span>
            </div>
          )}
          {/* PLV/SPV */}
          {tienePlvSpv(c) && (
            <div style={{ padding:"8px 20px", borderBottom:"1px solid #2A2A35", background:"#1a1500", display:"flex", alignItems:"center", gap:"10px" }}>
              {/\bPLV\b/i.test(c.textos||"") && <span style={{ background:"#F59E0B", color:"#111116", fontWeight:900, fontSize:"11px", borderRadius:"4px", padding:"2px 8px" }}>PLV</span>}
              {/\bSPV\b/i.test(c.textos||"") && <span style={{ background:"#F59E0B", color:"#111116", fontWeight:900, fontSize:"11px", borderRadius:"4px", padding:"2px 8px" }}>SPV</span>}
              {/\bSERVICIOS REUNIDOS\b|\bSR\b/i.test(c.textos||"") && <span style={{ background:"#F59E0B", color:"#111116", fontWeight:900, fontSize:"11px", borderRadius:"4px", padding:"2px 8px" }}>SR</span>}
              <span style={{ color:"#fbbf24", fontWeight:600, fontSize:"12px" }}>Este camión lleva material — espacio no optimizado</span>
            </div>
          )}
          {/* Comentarios */}
          {c.textos && (
            <div style={{ padding:"10px 20px", borderBottom:"1px solid #2A2A35", background:"#111118" }}>
              <div style={{ fontSize:"10px", color:"#9CA3AF", fontWeight:700, letterSpacing:"0.08em", marginBottom:"6px" }}>COMENTARIOS</div>
              <div style={{ display:"flex", flexDirection:"column", gap:"2px" }}>
                {c.textos.split(/[;/]/).map(l => l.trim()).filter(l => l).map((l,i) => (
                  <div key={i} style={{ fontSize:"12px", color:"#E5E7EB", lineHeight:1.5 }}>{l}</div>
                ))}
              </div>
            </div>
          )}
          {/* Body */}
          {(() => {
            const [verTodos, setVerTodos] = React.useState(false);
            const listaVisible = verTodos ? formatosDelTransp : soloRotura;
            return (
              <div style={{ overflowY:"auto", flex:1 }}>
                {/* Header toggleable */}
                <div style={{ padding:"10px 20px", borderBottom:"1px solid #2A2A35", display:"flex", alignItems:"center", justifyContent:"space-between", background:"#111118" }}>
                  <div style={{ fontSize:"11px", color:"#9CA3AF", fontWeight:700, letterSpacing:"0.08em" }}>
                    {verTodos
                      ? <>{formatosDelTransp.length} FORMATO{formatosDelTransp.length!==1?"S":""} EN ESTE TRANSPORTE {soloRotura.length>0 && <span style={{ color:"#fca5a5" }}>({soloRotura.length} en rotura)</span>}</>
                      : soloRotura.length === 0
                        ? <span style={{ color:"#4ade80" }}>✓ Sin formatos en rotura</span>
                        : <>{soloRotura.length} FORMATO{soloRotura.length!==1?"S":""} EN ROTURA DE STOCK</>
                    }
                  </div>
                  {formatosDelTransp.length > 0 && (
                    <button onClick={e => { e.stopPropagation(); setVerTodos(v => !v); }}
                      style={{ background: verTodos ? "#1e3a5f" : "#1A1A24", border:`1px solid ${verTodos?"#38BDF8":"#3F3F46"}`, borderRadius:"6px", color: verTodos ? "#38BDF8" : "#9CA3AF", padding:"4px 10px", fontSize:"11px", fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
                      {verTodos ? "Solo roturas" : `📦 Ver todos (${formatosDelTransp.length})`}
                    </button>
                  )}
                </div>

                <div style={{ padding:"14px 20px" }}>
                  {listaVisible.length === 0 && !verTodos && (
                    <div style={{ color:"#4ade80", textAlign:"center", padding:"30px", fontSize:"13px" }}>✓ Sin formatos en rotura para este transporte.</div>
                  )}
                  {listaVisible.length > 0 && (
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(58px, 1fr))", gap:"6px" }}>
                      {listaVisible.map(({ cod, totalQty, palesQty, esCritico }) => (
                        <div key={cod} style={{
                          background: esCritico ? "#1a0808" : "#1A1A24",
                          border: `1px solid ${esCritico ? "#ef4444" : "#2A2A35"}`,
                          borderTop: `3px solid ${esCritico ? "#ef4444" : "#3F3F46"}`,
                          borderRadius:"7px",
                          padding:"6px 6px",
                          display:"flex", flexDirection:"column", alignItems:"center", gap:"3px",
                          textAlign:"center"
                        }}>
                          {esCritico && <span style={{ fontSize:"8px", color:"#ef4444", fontWeight:900, lineHeight:1 }}>🚨</span>}
                          <span style={{ color: esCritico ? "#fca5a5" : "#E5E7EB", fontWeight:800, fontSize:"12px", fontFamily:"'DM Mono','JetBrains Mono',monospace", lineHeight:1 }}>{cod}</span>
                          <div style={{ width:"100%", height:"1px", background: esCritico ? "#3f1010" : "#2A2A35", margin:"1px 0" }}/>
                          <div style={{ fontSize:"12px", color: esCritico ? "#fca5a5" : "#F3F4F6", fontWeight:700, lineHeight:1 }}>{totalQty} <span style={{ fontSize:"9px", color:"#6B7280" }}>uds</span></div>
                          {palesQty !== "—" && <div style={{ fontSize:"10px", color: esCritico ? "#fca5a5" : "#9CA3AF", fontWeight:600, lineHeight:1 }}>{palesQty} <span style={{ fontSize:"8px", color:"#6B7280" }}>pal</span></div>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    );
  };

  // ── MapPopup ──────────────────────────────────────────────────────
  const MapPopup = () => {
    if (!mapPopup) return null;
    const query = encodeURIComponent(mapPopup + ", España");
    const mapsUrl = `https://www.google.com/maps/search/${query}`;
    return (
      <div onClick={() => setMapPopup(null)}
        style={{ position:"fixed", inset:0, background:"#000000CC", zIndex:1100, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
        <div onClick={e => e.stopPropagation()}
          style={{ background:"#16161C", border:"1px solid #2A2A35", borderRadius:"12px", width:"100%", maxWidth:"400px", boxShadow:"0 24px 64px #000" }}>
          <div style={{ padding:"16px 20px", borderBottom:"1px solid #2A2A35", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ color:"#E5E7EB", fontWeight:700, fontSize:"15px" }}>📍 {mapPopup}</span>
            <button onClick={() => setMapPopup(null)}
              style={{ background:"#2A2A35", border:"none", color:"#9CA3AF", borderRadius:"6px", padding:"4px 10px", cursor:"pointer", fontSize:"16px" }}>✕</button>
          </div>
          <div style={{ padding:"24px 20px", display:"flex", flexDirection:"column", gap:"12px", alignItems:"center" }}>
            <div style={{ color:"#9CA3AF", fontSize:"13px", textAlign:"center" }}>
              Haz clic para abrir la ubicación en Google Maps
            </div>
            <a href={mapsUrl} target="_blank" rel="noreferrer"
              style={{ background:"#1E3A5F", border:"1px solid #38BDF844", borderRadius:"8px", color:"#38BDF8", padding:"10px 24px", textDecoration:"none", fontWeight:700, fontSize:"14px", display:"flex", alignItems:"center", gap:"8px" }}>
              🗺️ Abrir en Google Maps ↗
            </a>
          </div>
        </div>
      </div>
    );
  };

  // ── renderReparto ─────────────────────────────────────────────────
  const renderReparto = () => {
    const fac = FACTORIES.find(f => f.id === activeFab) || FACTORIES[0];
    const fd = dayData[fac.id] || {};
    const pm = fd.pedidosMap || {};
    const sm = fd.sapStockMap || {};
    const criticos = sortCriticos(fd.sapCriticos || []);
    const cargas = cargasData[fac.id]?.todos || [];

    const transpMap = {};
    cargas.forEach(c => {
      const key = String(c.nTransp||"").trim();
      if (key && !transpMap[key]) transpMap[key] = c;
    });

    const getTransp = (nt) => transpMap[String(nt||"").trim()] || {};

    const sortTransp = (list) => {
      const tmpMap = {};
      list.forEach(p => {
        const nt = String(p.transporte||"").trim();
        if (!tmpMap[nt]) tmpMap[nt] = { fechaCarga: p.fechaCarga||"", tramo: p.tramo||"" };
      });
      return [...list].sort((a, b) => {
        const nt_a = String(a.transporte||"").trim();
        const nt_b = String(b.transporte||"").trim();
        const da = tmpMap[nt_a] || {};
        const db = tmpMap[nt_b] || {};
        // Fecha carga: "12/05/26" DD/MM/YY → "260512" YY/MM/DD para comparar
        const parseFecha = (f) => {
          if (!f) return "999999";
          const p = (f||"").split("/");
          if (p.length === 3) {
            // DD/MM/YYYY o DD/MM/YY
            const yy = p[2].length === 4 ? p[2] : "20"+p[2];
            return yy + p[1].padStart(2,"0") + p[0].padStart(2,"0");
          }
          return f;
        };
        const fa = parseFecha(da.fechaCarga);
        const fb = parseFecha(db.fechaCarga);
        if (fa !== fb) return fa.localeCompare(fb);
        // Tramo "08:00-09:00" → comparar por hora inicio
        const horaInicio = (t) => (t||"99:99").split("-")[0].trim();
        return horaInicio(da.tramo).localeCompare(horaInicio(db.tramo));
      });
    };

    const parseFechaSort = (f) => {
      if (!f) return "99999999";
      const p = f.split("/");
      if (p.length === 3) {
        const yy = p[2].length === 4 ? p[2] : "20"+p[2];
        return yy + p[1].padStart(2,"0") + p[0].padStart(2,"0");
      }
      return f;
    };

    if (criticos.length === 0) return (
      <div style={{ color:"#606070", textAlign:"center", padding:"60px", fontSize:"14px" }}>
        Carga stocks y pedidos para ver el reparto
      </div>
    );

    return (
      <div style={{ padding:"0 4px" }}>
        {criticos.map(({ cod, diff }) => {
          const stockDisp = parseFloat(sm[cod]?.dispon ?? sm[cod]?.disponible ?? 0);
          const peds = pm[cod] || [];
          const transpList = sortTransp(peds.filter(p => String(p.transporte||"").trim()));

          const getPales = (qty) => Math.round(qty * 100) / 100;

          // Agrupar por transporte
          const byTransp = {};
          peds.filter(p => String(p.transporte||"").trim()).forEach(p => {
            const nt = String(p.transporte||"").trim();
            if (!nt) return;
            if (!byTransp[nt]) byTransp[nt] = { nTransp: nt, qty: 0, cliente: p.cliente||"", fechaCarga: p.fechaCarga||"", tramo: p.tramo||"", camion: getTransp(nt) };
            byTransp[nt].qty += Number(p.qty)||0;
          });

          // Ordenar transportes agrupados por fechaCarga y tramo
          const transpOrden = Object.values(byTransp).sort((a, b) => {
            const fa = parseFechaSort(a.fechaCarga);
            const fb = parseFechaSort(b.fechaCarga);
            if (fa !== fb) return fa.localeCompare(fb);
            const ha = (a.tramo||"99:99").split("-")[0].trim();
            const hb = (b.tramo||"99:99").split("-")[0].trim();
            return ha.localeCompare(hb);
          });

        // DEBUG: mostrar primeros valores


          // Calcular totales y punto de agotamiento
          let acumStock = 0;
          let agotaEn = null;
          transpOrden.forEach((t, idx) => {
            if (agotaEn !== null) return;
            const keyR = `${fac.id}_${cod}_${t.nTransp}`;
            const pr = palesReales[keyR] !== undefined ? Number(palesReales[keyR]) : (getPales(t.qty)||0);
            acumStock += pr;
            if (acumStock > stockDisp) agotaEn = idx;
          });
          const totalPalesReal = transpOrden.reduce((s, t) => {
            const keyR = `${fac.id}_${cod}_${t.nTransp}`;
            return s + (palesReales[keyR] !== undefined ? Number(palesReales[keyR]) : (getPales(t.qty)||0));
          }, 0);
          const stockFinal = stockDisp - totalPalesReal;

          return (
            <div key={cod} style={{ background:"#16161C", border:"1px solid #2A2A35", borderRadius:"10px", marginBottom:"16px", overflow:"hidden" }}>
              {/* Header formato */}
              <div style={{ background:"#1E1E28", padding:"10px 16px", display:"flex", alignItems:"center", gap:"16px", flexWrap:"wrap" }}>
                <span style={{ color: fac.color, fontWeight:900, fontSize:"16px", fontFamily:"'DM Mono',monospace" }}>{cod}</span>
                <span style={{ color:"#9CA3AF", fontSize:"12px" }}>Stock disp: <span style={{ color:"#4ade80", fontWeight:700 }}>{stockDisp.toFixed(2)} pal.</span></span>
                <span style={{ color:"#9CA3AF", fontSize:"12px" }}>Total pedido: <span style={{ color:"#fca5a5", fontWeight:700 }}>{totalPalesReal.toFixed(2)} pal.</span></span>
                <span style={{ color:"#9CA3AF", fontSize:"12px" }}>Stock final: <span style={{ color: stockFinal < 0 ? "#ef4444" : "#4ade80", fontWeight:700 }}>{stockFinal.toFixed(2)} pal.</span></span>
                {getPlanForCod(cod).length > 0 && (
                  <div style={{ display:"flex", gap:"6px", flexWrap:"wrap" }}>
                    {getPlanForCod(cod).map((p,pi) => (
                      <div key={pi} style={{ background:"#0a3d1f", border:"1px solid #22c55e", borderRadius:"4px", padding:"2px 8px", display:"inline-flex", gap:"6px", alignItems:"center", fontSize:"10px" }}>
                        <span style={{ color:"#6ee7a0", fontWeight:900 }}>GRUPO {p.grupo?.replace(/GRUPO\s*/i,"")}</span>
                        <span style={{ color:"#FFFFFF", fontWeight:600 }}>{p.hi}</span>
                        <span style={{ color:"#9CA3AF" }}>→</span>
                        <span style={{ color:"#fca5a5", fontWeight:600 }}>{p.hf}</span>
                        {p.dia && <span style={{ color:"#93c5fd", fontSize:"9px" }}>{p.dia}</span>}
                      </div>
                    ))}
                  </div>
                )}
                <button onClick={() => {
                  const keys = Object.keys(palesReales).filter(k => k.startsWith(`${fac.id}_${cod}_`));
                  if (keys.length === 0) return;
                  setPalesReales(prev => { const n={...prev}; keys.forEach(k => delete n[k]); return n; });
                }} style={{ background:"#2D2D3A", border:"1px solid #3F3F46", color:"#9CA3AF", borderRadius:"6px", padding:"3px 10px", cursor:"pointer", fontSize:"11px", fontFamily:"inherit", marginLeft:"auto" }}>↺ Resetear</button>
              </div>

              {transpOrden.length === 0
                ? <div style={{ padding:"16px", color:"#52525B", fontSize:"12px" }}>Sin transportes con pedidos</div>
                : <>
                    {/* Cabecera tabla */}
                    <div style={{ display:"grid", gridTemplateColumns:"68px 60px 90px 110px 90px 1fr", gap:"0", padding:"6px 12px", background:"#111118", borderBottom:"1px solid #2A2A35", fontSize:"10px", color:"#6B7280", fontWeight:700, letterSpacing:"0.05em" }}>
                      <span style={{ textAlign:"right", paddingRight:"8px" }}>REAL</span>
                      <span style={{ textAlign:"right", paddingRight:"8px" }}>PALES</span>
                      <span>F. CARGA</span>
                      <span>TRAMO</span>
                      <span>TRANSPORTE</span>
                      <span>DESTINO</span>
                    </div>
                    {/* Filas */}
                    {transpOrden.map((t, idx) => {
                      const keyR = `${fac.id}_${cod}_${t.nTransp}`;
                      const palesCalc = getPales(t.qty);
                      const esAgotamiento = agotaEn === idx;
                      const pasadoStock = agotaEn !== null && idx >= agotaEn;
                      return (
                        <div key={t.nTransp} style={{
                          display:"grid", gridTemplateColumns:"68px 60px 90px 110px 90px 1fr", gap:"0", padding:"2px 12px",
                          background: pasadoStock ? "#1a0808" : idx%2===0 ? "#16161C" : "#1A1A24",
                          borderBottom:"1px solid #1E1E2A", alignItems:"center",
                          borderLeft: pasadoStock ? "3px solid #ef4444" : "3px solid #22C55E"
                        }}>
                          {/* Pales real (input) */}
                          <div style={{ textAlign:"right", paddingRight:"8px" }}>
                            <input
                              type="number" step="0.1" min="0"
                              placeholder={palesCalc !== null ? palesCalc.toFixed(1) : "—"}
                              value={palesReales[keyR] !== undefined ? palesReales[keyR] : ""}
                              onChange={e => {
                                const val = e.target.value;
                                setPalesReales(prev => { const n={...prev}; if(val==="") delete n[keyR]; else n[keyR]=val; 
                                  fbSync({ palesReales: n }); return n; });
                              }}
                              style={{ width:"60px", background:"#111116", border:"1px solid #3F3F46", borderRadius:"4px", color:"#F59E0B", fontSize:"11px", fontWeight:700, padding:"1px 4px", textAlign:"right", outline:"none", fontFamily:"inherit", MozAppearance:"textfield", WebkitAppearance:"none", appearance:"none" }}
                            />
                          </div>
                          {/* Pales pedido */}
                          <div style={{ textAlign:"right", paddingRight:"8px", color: pasadoStock ? "#ef4444" : "#E5E7EB", fontWeight:700, fontSize:"12px" }}>
                            {palesCalc !== null ? palesCalc.toFixed(1) : "—"}
                          </div>
                          {/* Fecha carga */}
                          <div style={{ color:"#9CA3AF", fontSize:"11px" }}>{t.fechaCarga||"—"}</div>
                          {/* Tramo horario */}
                          <div style={{ color:"#38BDF8", fontSize:"11px", fontFamily:"'DM Mono',monospace" }}>{t.tramo||"—"}</div>
                          {/* Transporte */}
                          <div style={{ color: pasadoStock ? "#ef4444" : "#D946EF", fontWeight:700, fontSize:"12px", fontFamily:"'DM Mono',monospace" }}>{t.nTransp}</div>
                          {/* Destino */}
                          <div style={{ color:"#E5E7EB", fontSize:"11px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{t.cliente || "—"}</div>
                        </div>
                      );
                    })}
