// ── Constants ─────────────────────────────────────────────────────
const FACTORIES = [
  { id: "agrela", label: "A Grela", color: "#D946EF" },
  { id: "moras",  label: "Moras",   color: "#38BDF8" },
];

const SECTIONS = [
  { id: "transporte", label: "Cargas", icon: "🚛", color: "#D946EF" },
  { id: "centros", label: "Centros Log.", icon: "🏬", color: "#06B6D4" },
  { id: "planificacion", label: "Planificación", icon: "📅", color: "#10B981" },
  { id: "almacen",       label: "Almacén Auto.", icon: "🏭", color: "#EF4444" },
  { id: "stocks_agrela",  label: "Stocks Grela",  icon: "📦", color: "#D946EF" },
  { id: "stocks_moras",   label: "Stocks Moras",   icon: "📦", color: "#38BDF8" },

];

const ENTRY_SECTIONS = ["almacen","transporte","stocks"];

const sortCriticos = (arr) => [...(arr||[])].map(r => ({...r, diff: r.diff??((r.fisico??0)-(r.bloq??0)-(r.pedidos??0))})).sort((a,b) => { const aNum=/^\d+$/.test(a.cod), bNum=/^\d+$/.test(b.cod); if(aNum&&!bNum)return -1; if(!aNum&&bNum)return 1; if(aNum&&bNum)return parseInt(a.cod)-parseInt(b.cod); return a.cod.localeCompare(b.cod); });

// ── Helpers ───────────────────────────────────────────────────────
function formatDate(str) {
  const [y, m, d] = str.split("-");
  return `${d}/${m}/${y}`;
}
function todayStr() { return new Date().toISOString().split("T")[0]; }
function offsetDate(str, days) {
  const d = new Date(str); d.setDate(d.getDate() + days);
  return d.toISOString().split("T")[0];
}
function weekOf(str) {
  const d = new Date(str);
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return `${mon.toISOString().split("T")[0]}__${sun.toISOString().split("T")[0]}`;
}
function monthOf(str) { return str.slice(0, 7); }

// ── localStorage helpers ─────────────────────────────────────────
const LS_PREFIX = "diario_dia_";
async function dbGet(date) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + date);
    if (raw) return JSON.parse(raw);
    return { agrela: {}, moras: {} };
  } catch(e) { console.error(e); return { agrela: {}, moras: {} }; }
}
async function dbSet(date, data) {
  try {
    localStorage.setItem(LS_PREFIX + date, JSON.stringify(data));
  } catch(e) { console.error(e); }
}
async function dbList() {
  try {
    const result = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(LS_PREFIX)) {
        const date = key.replace(LS_PREFIX, "");
        const raw = localStorage.getItem(key);
        if (raw) result.push({ date, data: JSON.parse(raw) });
      }
    }
    return result.sort((a,b) => a.date.localeCompare(b.date));
  } catch(e) { console.error(e); return []; }
}

// ── CSV export ────────────────────────────────────────────────────
function exportCSV(allDays) {
  const rows = [["Fecha","Fábrica","Sección","Título","Texto","Hora","Cargados","Pendientes","Nocturnas","Stock%"]];
  allDays.forEach(({ date, data }) => {
    FACTORIES.forEach(fac => {
      const fd = data[fac.id] || {};
      const tm = fd.transporteMeta || {};
      const sm = fd.stocksMeta || {};
      if (Object.values(tm).some(Boolean))
        rows.push([formatDate(date), fac.label, "Transporte", "", tm.notas||"", "", tm.cargados||"", tm.pendientes||"", tm.nocturnas||"", ""]);
      if (sm.nivel || sm.alertas)
        rows.push([formatDate(date), fac.label, "Stocks", "", sm.alertas||"", "", "", "", "", sm.nivel||""]);
      ENTRY_SECTIONS.forEach(secId => {
        (fd[secId]||[]).forEach(e => {
          rows.push([formatDate(date), fac.label, secId, e.titulo||"", e.texto||"", e.hora||"", "", "", "", ""]);
        });
      });
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "diario_export.csv"; a.click();
  URL.revokeObjectURL(url);
}

// ── Small components ──────────────────────────────────────────────
const { useState, useEffect, useCallback } = React;

function Badge({ count, color }) {
  if (!count) return null;
  return <span style={{ background: color, color: "#fff", borderRadius: "9999px", fontSize: "10px", fontWeight: 700, padding: "1px 6px", marginLeft: "5px", display: "inline-block", minWidth: "18px", textAlign: "center" }}>{count}</span>;
}

function EntryList({ entries = [], onDelete, color }) {
  if (!entries.length) return <p style={{ color: "#52525B", fontStyle: "italic", fontSize: "12px", margin: "6px 0 0" }}>Sin entradas</p>;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "5px", marginTop: "8px" }}>
      {entries.map((e, i) => (
        <div key={i} style={{ background: "#0D0D0F", border: "1px solid #44444F", borderLeft: `3px solid ${color}`, borderRadius: "6px", padding: "7px 10px", display: "flex", justifyContent: "space-between", gap: "8px" }}>
          <div style={{ flex: 1 }}>
            {e.titulo && <div style={{ color: "#F3F4F6", fontWeight: 600, fontSize: "12px" }}>{e.titulo}</div>}
            {e.texto  && <div style={{ color: "#9CA3AF", fontSize: "12px", marginTop: e.titulo ? "2px" : 0 }}>{e.texto}</div>}
            <div style={{ color: "#52525B", fontSize: "10px", marginTop: "3px" }}>{e.hora}</div>
          </div>
          {onDelete && <button onClick={() => onDelete(i)} style={{ background: "none", border: "none", color: "#52525B", cursor: "pointer", fontSize: "18px", padding: 0, lineHeight: 1 }}>×</button>}
        </div>
      ))}
    </div>
  );
}

function FactoryPanel({ factory, children, hideTitle }) {
  return (
    <div style={{ flex: 1, minWidth: 0, background: "#18181B", border: `1px solid ${factory.color}33`, borderTop: `3px solid ${factory.color}`, borderRadius: "10px", padding: "14px" }}>
      {!hideTitle && <div style={{ fontSize: "11px", fontWeight: 700, color: factory.color, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: "12px" }}>🏭 {factory.label}</div>}
      {children}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  const [appError, setAppError] = React.useState(null);
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const isToday = selectedDate === todayStr();
  const [activeSection, setActiveSection] = useState("transporte");
  const [activeFab, setActiveFab] = useState(() => { try { return localStorage.getItem("diario_fab") || "agrela"; } catch(e) { return "agrela"; } });
  const setActiveFabSave = (f) => { setActiveFab(f); try { localStorage.setItem("diario_fab", f); } catch(e) {} setActiveSection("transporte"); };
  const [dayData, setDayData] = useState({ agrela: {}, moras: {} });
  const [loading, setLoading] = useState(true);
  const [savedMsg, setSavedMsg] = useState("");
  const [histDays, setHistDays] = useState([]);
  const [showClientes, setShowClientes] = useState(true);
  const [camionPopup, setCamionPopup] = useState(null);
  const [mapPopup, setMapPopup] = useState(null);

  const EMOJI_PICKER = ["👆","👎","💪","🙋","🤝","😴","🍽️","💿","🔧","🔩","⛽","🛢️","📦","📋","📊","🗂️","🔒","🔓","⏱️","⏰","🚨","🆘","✅","❌","⛔","🟢","🟡","🔴","🏭","🏢","🚪","⚖️","🧲","🔋","💡","🛑","🚛","🚚","🚜","🏗️","🚧","⚠️","🚦","🛻","🚐","🚑","🔑","🪝","🧰","⚙️","🛞","⛽","🏋️","📍","🗺️","🧭","📡","📟","🖥️","💻","📱","🔔","🔕","💬","📢","🔈","🔇"];

  const DEFAULT_INCIDENCIAS = [
    { id:"prioridad", label:"Prioridad",    icon:"👆", conHora: false },
    { id:"comida",    label:"Sale a comer", icon:"🍽️", conHora: false },
    { id:"descanso",  label:"Descanso",     icon:"😴", conHora: false },
    { id:"averia",    label:"Averiado",     icon:"🔧", conHora: false },
    { id:"disco",     label:"Sin disco",    icon:"💿", conHora: true  },
  ];

  const [incidenciasConfig, setIncidenciasConfig] = useState(() => {
    try { const s = localStorage.getItem("diario_incidencias"); return s ? JSON.parse(s) : DEFAULT_INCIDENCIAS; } catch(e) { return DEFAULT_INCIDENCIAS; }
  });
  const saveIncidenciasConfig = (cfg) => { setIncidenciasConfig(cfg); try { localStorage.setItem("diario_incidencias", JSON.stringify(cfg)); } catch(e) {} };
  const INCIDENCIAS = [{ id:"", label:"— Sin incidencia", icon:null }, ...incidenciasConfig];

  // Incidencias: array de hasta 3 { tipo, hora }
  const getIncidencias = (fid, nTransp) => {
    const val = dayData[fid]?.incidenciasCamion?.[nTransp];
    if (!val) return [];
    return Array.isArray(val) ? val : [val]; // retrocompat
  };
  const setIncidencias = (fid, nTransp, arr) => {
    const updated = { ...dayData, [fid]: { ...dayData[fid], incidenciasCamion: { ...(dayData[fid]?.incidenciasCamion||{}), [nTransp]: arr.length ? arr : null }}};
    setDayData(updated);
    saveData(updated);
    fbSync({ incidenciasCamion: { [fid]: { [nTransp]: arr.length ? arr : null } } });
  };
  // Compat legacy
  const getIncidencia = (fid, nTransp) => { const arr = getIncidencias(fid, nTransp); return arr[0] || null; };
  const setIncidencia = (fid, nTransp, tipo, hora) => setIncidencias(fid, nTransp, tipo ? [{tipo, hora:hora||""}] : []);
  const [pesosAgencia, setPesosAgencia] = useState(() => {
    try { const s = localStorage.getItem("diario_pesos_agencia"); return s ? JSON.parse(s) : {}; } catch(e) { return {}; }
  });
  const savePesosAgencia = (data) => { setPesosAgencia(data); try { localStorage.setItem("diario_pesos_agencia", JSON.stringify(data)); } catch(e) {} };
  const parsePesosAgenciaXlsx = (ab) => {
    try {
      const wb = XLSX.read(ab, { type:"array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1 });
      const map = {};
      rows.slice(1).forEach(r => {
        const agencia = r[0] ? String(r[0]).trim() : null;
        const peso = r[1] ? Number(r[1]) : null;
        if (agencia && peso) map[agencia.toUpperCase()] = peso;
      });
      savePesosAgencia(map);
      showSaved(`✓ Pesos cargados: ${Object.keys(map).length} agencias`);
    } catch(e) { showSaved("⚠️ Error: " + e.message); }
  };
  const getPesoMaxAgencia = (transport) => {
    if (!transport || !Object.keys(pesosAgencia).length) return null;
    const key = transport.toUpperCase().trim();
    if (pesosAgencia[key]) return pesosAgencia[key];
    // Buscar quitando sufijos comunes
    const keyBase = key.replace(/\s+HR$|\s+S\.L\.?$|\s+S\.A\.?$/,"").trim();
    const found = Object.keys(pesosAgencia).find(k => {
      const kBase = k.replace(/\s+HR$|\s+S\.L\.?$|\s+S\.A\.?$/,"").trim();
      return key === k || keyBase === kBase || key.includes(kBase) || kBase.includes(keyBase);
    });
    return found ? pesosAgencia[found] : null;
  };
  const tienePlvSpv = (c) => /\bPLV\b|\bSPV\b|\bSERVICIOS REUNIDOS\b|\bSR\b/i.test(c.textos || "");

  const isPesoExcedido = (c, fid) => {
    if (!c.peso) return false;
    if (fid && isPesoIgnorado(fid, c.nTransp)) return false;
    const cleaned = c.peso.replace(/\s*KG\s*/i,"").replace(/\./g,"").replace(/,/g,".").trim();
    const kg = parseFloat(cleaned);
    if (isNaN(kg)) return false;
    const max = getPesoMaxAgencia(c.transport);
    return max ? kg > max : false;
  };
  const [pesosIgnorados, setPesosIgnorados] = useState({});
  const [roturasIgnoradas, setRoturasIgnoradas] = useState({});
  const ignorarRotura = (fid, nTransp) => { setRoturasIgnoradas(p => { const n={...p, [`${fid}_${nTransp}`]:true}; fbSync({roturasIgnoradas:n}); return n; }); };
  const quitarIgnorarRotura = (fid, nTransp) => { setRoturasIgnoradas(p => { const n={...p}; delete n[`${fid}_${nTransp}`]; fbSync({roturasIgnoradas:n}); return n; }); };
  const isRoturaIgnorada = (fid, nTransp) => !!roturasIgnoradas[`${fid}_${nTransp}`];
  const ignorarPesoAlerta = (fid, nTransp) => { setPesosIgnorados(p => { const n={...p, [`${fid}_${nTransp}`]:true}; fbSync({pesosIgnorados:n}); return n; }); };
  const quitarIgnorarPeso = (fid, nTransp) => { setPesosIgnorados(p => { const n={...p}; delete n[`${fid}_${nTransp}`]; fbSync({pesosIgnorados:n}); return n; }); };
  const isPesoIgnorado = (fid, nTransp) => !!pesosIgnorados[`${fid}_${nTransp}`];

  const getPesoKg = (c) => {
    if (!c.peso) return null;
    const cleaned = c.peso.replace(/\s*KG\s*/i,"").replace(/\./g,"").replace(/,/g,".").trim();
    const v = parseFloat(cleaned);
    return isNaN(v) ? null : v;
  };
  const [cargasAyer, setCargasAyer] = useState({agrela:null, moras:null});
  const [cargasAyerFecha, setCargasAyerFecha] = useState({agrela:"", moras:""});
  const [pasilloFiltro, setPasilloFiltro] = useState("todos");
  const [busqTransp, setBusqTransp] = useState(""); // "todos" | "criticos" | "rompen" | "nuevos"

  const parseCargasAyerXlsx = (arrayBuffer, fid) => {
    try {

      const hIdx = rawRows.findIndex(r => r.some(v => String(v).trim() === "Articulo"));

      const iCod2   = headers2.findIndex(h => String(h).trim() === "Articulo");

      const iStock2 = headers2.findIndex(h => String(h).trim() === "Stock");
      const iTipo2  = headers2.findIndex(h => String(h).trim() === "Tipo pale");
      const iEst2   = headers2.findIndex(h => String(h).trim() === "Estado");
      const iPasillo = 27; // col AB = índice 27
      const articulos = {};
      const pasillosSet = new Set();
      rawRows.slice(hIdx + 1).forEach(r => { // datos desde fila siguiente a cabeceras
        const cod = String(r[iCod2]||"").trim().padStart(4,"0");
        const desc = String(r[iDesc2]||"").trim();
        const stock = Number(r[iStock2]||0);

        const pasillo = String(r[iPasillo]||"").trim();
        if (pasillo && pasillo !== "Pasillo") pasillosSet.add(pasillo);
        const pasilloKey = pasillo || "?";
        if (cod && cod !== "0000" && cod !== "Articulo" && iCod2 >= 0) {
          if (!articulos[cod]) articulos[cod] = { desc, stock:0, epals:0, ipals:0, porPasillo:{} };
          if (!articulos[cod].porPasillo[pasilloKey]) articulos[cod].porPasillo[pasilloKey] = { palesDS:[], palesBL:[] };
          const pp = articulos[cod].porPasillo[pasilloKey];
          // Guardar cajas de cada pale para comparar con Uds/Pale
          if (estado === "BL") pp.palesBL.push(stock);
          else pp.palesDS.push(stock);
          articulos[cod].stock += stock;

      });

  // ── Renderers ─────────────────────────────────────────────────────
  // ── Planificación Envasado XLSX parser ──────────────────────────
  const parsePlanXlsx = (arrayBuffer) => {
    try {
      const wb = XLSX.read(arrayBuffer, { type:"array", cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
      const getVal = (r, c) => { const cell = ws[XLSX.utils.encode_cell({r, c})]; return cell ? cell.v : null; };
      const cleanStr = (v) => v ? String(v).replace(/\xa0/g,"").replace(/\s+/g," ").trim() : "";

      // Convierte Date, serial Excel o texto a { hora: "HH:MM", dia: "DD/MM" }
      const serialToHoraDia = (v) => {
        if (!v) return { hora:"", dia:"" };
        // Objeto Date (cuando cellDates:true)
        if (v instanceof Date) {
          const h = String(v.getHours()).padStart(2,"0");
          const m = String(v.getMinutes()).padStart(2,"0");
          const d = String(v.getDate()).padStart(2,"0");
          const mo = String(v.getMonth()+1).padStart(2,"0");
          return { hora: `${h}:${m}`, dia: `${d}/${mo}` };
        }
        // Serial numérico Excel
        if (typeof v === "number") {
          const totalMin = Math.round((v - Math.floor(v)) * 1440);
          const h = Math.floor(totalMin / 60) % 24;
          const m = totalMin % 60;
          const hora = String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
          const d = new Date(Math.round((v - 25569) * 86400 * 1000));
          const dia = (d.getUTCDate()+"").padStart(2,"0") + "/" + ((d.getUTCMonth()+1)+"").padStart(2,"0");
          return { hora, dia };
        }
        // Texto: "12/05/2026 2:02"
        const s = String(v).trim();
        const match = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})\s+(\d{1,2}):(\d{2})/);
        if (match) {
          return { hora: match[4].padStart(2,"0")+":"+match[5], dia: match[1].padStart(2,"0")+"/"+match[2].padStart(2,"0") };
        }
        return { hora: s, dia:"" };
      };

      // Normaliza código: 700210 -> 0210, 70A061 -> A061
      const normCode = (v) => {
        if (!v) return "";
        let s = String(v).trim().replace(/\xa0/g,"");
        if (/^700\d/.test(s)) return s.slice(3).padStart(4,"0");
        if (/^70[A-Z]/.test(s)) return s.slice(2);
        if (/^70\d/.test(s)) return s.slice(2).padStart(4,"0");
        const n = parseFloat(s);
        if (!isNaN(n)) return String(Math.round(n)).slice(-4).padStart(4,"0");
        return s;
      };

      let currentGroup = "";
      // Índices de columnas (se detectan dinámicamente)
      let iCod = -1, iDesc = -1, iHi = -1, iHf = -1;
      const rows = [];

      for (let r = 0; r <= range.e.r; r++) {
        const col0 = getVal(r, 0);
        const s0 = cleanStr(col0);

        // Detectar cabecera de grupo: "Grupo: EG01 | Hora inicio: 21:30"
        if (s0 && /^Grupo:\s*EG\d+/i.test(s0)) {
          const m = s0.match(/EG(\d+)/i);
          currentGroup = m ? `GRUPO ${parseInt(m[1])}` : s0;
          // Reset índices para este grupo
          iCod = -1; iDesc = -1; iHi = -1; iHf = -1;
          continue;
        }

        // Detectar fila de cabeceras de columnas
        const rowVals = [];
        for (let c = 0; c <= range.e.c; c++) rowVals.push(cleanStr(getVal(r, c)));
        if (rowVals.includes("Código") || rowVals.includes("No Orden")) {
          iCod  = rowVals.findIndex(v => v === "Código");
          iDesc = rowVals.findIndex(v => v === "Descripción");
          iHi   = rowVals.findIndex(v => v === "Inicio Orden");
          iHf   = rowVals.findIndex(v => v === "Fin Orden");
          continue;
        }

        // Fila de datos
        if (!currentGroup || iCod < 0) continue;
        const rawCod = getVal(r, iCod);
        if (!rawCod) continue;
        const cod  = normCode(rawCod);
        const desc = iDesc >= 0 ? cleanStr(getVal(r, iDesc)) : "";
        const hiRaw = iHi >= 0 ? serialToHoraDia(getVal(r, iHi)) : { hora:"", dia:"" };
        const hfRaw = iHf >= 0 ? serialToHoraDia(getVal(r, iHf)) : { hora:"", dia:"" };
        const hi    = hiRaw.hora;
        const hf    = hfRaw.hora;
        const dia   = hiRaw.dia;
        const diaf  = hfRaw.dia;
        if (cod && (hi || hf)) {
          rows.push({ grupo: currentGroup, cod, desc, dia, diaf, hi, hf });
        }
      }

      setPlanData(prev => ({ ...prev, [activeFab]: rows }));
      setPlanFecha(prev => ({ ...prev, [activeFab]: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) }));
      showSaved("✓ Planificación cargada: " + rows.length + " turnos");
    } catch(e) {
      console.error("parsePlanXlsx error:", e);
      showSaved("⚠️ Error al leer planificación: " + e.message);
    }
  };

  // ── Cargas XLSX parser ──────────────────────────────────────────

      const header = rows[0].map(h => h ? String(h).trim() : "");

      const iInicio    = header.findIndex(h => h.includes("Inicio carga planificada"));

      const iTransport = header.findIndex(h => h.includes("Nombre transportista"));
      const iFechaEnt  = header.findIndex(h => h.includes("Fecha pref") || h.includes("Fecha de entrega"));
      const iFechaCarga = header.findIndex(h => /fecha.*carga/i.test(h) && !/arrastre/i.test(h));
      const iPoblacion = header.findIndex(h => h.includes("Población destino") || h.includes("Poblacion destino"));
      const iPeso      = header.findIndex(h => h.includes("Peso total transportado"));
      const iTractora  = header.findIndex(h => /tracto/i.test(h) && /matr/i.test(h));
      const iRemolque  = header.findIndex(h => /remolque/i.test(h) && /matr/i.test(h));
      const iOptima    = header.findIndex(h => /optim/i.test(h) && /carga/i.test(h));
      const iTextos    = header.findIndex(h => h.includes("Textos CSV"));
      const iSystore   = header.findIndex(h => h.includes("Systore") && h.includes("Status"));
      const seenTransp = new Set();
      const textosMap = {};
      const camiones = [];
      rows.slice(1).forEach(row => {
        const status = row[iStatus] ? parseInt(String(row[iStatus])) : null;
        const nTransp = row[iTransp] ? String(row[iTransp]).trim() : null;
        if (!status || !nTransp) return;
        // Acumular textos CSV por transporte
        if (iTextos >= 0 && row[iTextos]) {
          const txt = String(row[iTextos]).trim();
          if (txt) textosMap[nTransp] = textosMap[nTransp] ? textosMap[nTransp] + " " + txt : txt;
        }
        const isDup = seenTransp.has(nTransp);
        if (!isDup) seenTransp.add(nTransp);
        camiones.push({
          status,
          nTransp,
          cliente:    row[iCliente]   ? String(row[iCliente]).trim()   : "",
          inicio:     row[iInicio]    ? String(row[iInicio]).trim()    : "",
          fin:        row[iFin]       ? String(row[iFin]).trim()       : "",
          transport:  row[iTransport] ? String(row[iTransport]).trim() : "",
          fechaEnt: (() => {
            const v = row[iFechaEnt];
            if (!v) return "";
            if (v instanceof Date) return v.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
            if (typeof v === "number") {
              const d = new Date(Math.round((v - 25569) * 86400 * 1000));
              return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
            }
            const s = String(v).trim();
            // YYYY-MM-DD
            const m1 = s.match(/^(\d{4})[-.](\d{2})[-.](\d{2})/);
            if (m1) return `${m1[3]}/${m1[2]}/${m1[1].slice(2)}`;
            // DD.MM.YYYY o DD/MM/YYYY
            const m2 = s.match(/^(\d{2})[./](\d{2})[./](\d{4})/);
            if (m2) return `${m2[1]}/${m2[2]}/${m2[3].slice(2)}`;
            // DD.MM.YY o DD/MM/YY
            const m3 = s.match(/^(\d{2})[./](\d{2})[./](\d{2})$/);
            if (m3) return `${m3[1]}/${m3[2]}/${m3[3]}`;
            return s.split("T")[0].trim();
          })(),
          isDup,
          systore:  iSystore >= 0 && row[iSystore] ? parseInt(String(row[iSystore])) : null,
          textos: textosMap[nTransp] || "",
          poblacion: iPoblacion >= 0 && row[iPoblacion] ? String(row[iPoblacion]).trim() : "",
          tractora:  iTractora >= 0 && row[iTractora] ? String(row[iTractora]).trim() : "",
          remolque:  iRemolque >= 0 && row[iRemolque] ? String(row[iRemolque]).trim() : "",
          optimizada: iOptima >= 0 ? String(row[iOptima]||"").trim().toUpperCase() === "X" : null,
          fechaCarga: (() => {
            if (iFechaCarga < 0 || !row[iFechaCarga]) return "";
            const v = row[iFechaCarga];
            if (v instanceof Date) return v.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
            if (typeof v === "number") { const d = new Date(Math.round((v-25569)*86400*1000)); return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"}); }
            return String(v).split("T")[0].trim();
          })(),
          peso: (() => {
            if (iPeso < 0 || !row[iPeso]) return "";
            const v = Number(row[iPeso]);
            return isNaN(v) ? String(row[iPeso]).trim() : v.toLocaleString("es-ES", { maximumFractionDigits:0 }) + " KG";
          })()
        });
      });
      // Stats based on unique transportes
      const unique = camiones.filter(c => !c.isDup);
      const hasSystore = iSystore >= 0 && unique.some(c => c.systore !== null);
      const isEnCarga    = (c) => hasSystore ? (c.systore === 3 && [2,3].includes(c.status)) : c.status === 3;
      const isFinCarga   = (c) => hasSystore ? (c.status >= 4 && c.systore === 3) : c.status >= 4;
      const isRegistrado = (c) => hasSystore ? (c.status === 2 && [1,2].includes(c.systore)) : c.status === 2;
      const isPendiente  = (c) => hasSystore ? (c.status === 1 && [1,2].includes(c.systore)) : c.status === 1;
      const enCarga      = unique.filter(c => isEnCarga(c));
      const finCarga     = unique.filter(c => isFinCarga(c));
      const registrados  = unique.filter(c => isRegistrado(c));
      const pendientes_list = unique.filter(c => isPendiente(c));
      const pendientes   = pendientes_list.length;
      const total        = pendientes_list.length + registrados.length + enCarga.length + finCarga.length;
      if (esAyer) {
        // Solo guardamos los no finalizados del día anterior
        const noFinalizados = unique.filter(c => !isFinCarga(c)).map(c => ({...c, esAyer: true}));
        setCargasAyer(prev => ({ ...prev, [fid]: noFinalizados }));
        setCargasAyerFecha(prev => ({ ...prev, [fid]: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) }));
        showSaved(`✓ Día anterior: ${noFinalizados.length} camiones sin finalizar`);
      } else {
        setCargasData(prev => ({ ...prev, [fid]: { total, pendientes, registrados, enCarga, finCarga, pendientes_list, todos: unique } }));
        setCargasFecha(prev => ({ ...prev, [fid]: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) }));
        showSaved("✓ Cargas: " + total + " camiones, " + pendientes + " pendientes");
      }
    } catch(e) { console.error("parseCargasXlsx:", e); showSaved("⚠️ Error: " + e.message); }
  };

  const renderTransporte = () => {
    const fac = FACTORIES.find(f => f.id === activeFab) || FACTORIES[0];
    const fd = dayData[fac.id] || {};
    const cd = cargasData[fac.id] || null;

    // Ordenar por fecha de entrega (más antigua primero, sin fecha al final)
    const sortByFecha = (items) => [...items].sort((a,b) => {

      const pb = b.fechaEnt ? b.fechaEnt.split("/").reverse().join("") : "99999999";

    });

    const tieneAlerta = (nTransp) => {

    // Tarjeta individual de camión
    const CamionCard = ({ c, color }) => {

      };
      const fechaColor = getFechaColor();
      const alerta = tieneAlerta(c.nTransp) && !isRoturaIgnorada(fac.id, c.nTransp);

      return (
        <div onClick={() => setCamionPopup({ c, fid: fac.id })}

              </svg>
            )}
            {tienePlvSpv(c) && (() => {
              const texto = c.textos || "";
              const tienePLV = /\bPLV\b/i.test(texto);
              const tieneSPV = /\bSPV\b/i.test(texto);
              const tieneSR  = /\bSERVICIOS REUNIDOS\b|\bSR\b/i.test(texto);
              return <>
                {tienePLV && <span title="Lleva PLV" style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:"22px", height:"22px", borderRadius:"4px", background:"#F59E0B", color:"#111116", fontSize:"9px", fontWeight:900, letterSpacing:"0.02em", lineHeight:1, flexShrink:0 }}>PLV</span>}
                {tieneSPV && <span title="Lleva SPV" style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:"22px", height:"22px", borderRadius:"4px", background:"#F59E0B", color:"#111116", fontSize:"9px", fontWeight:900, letterSpacing:"0.02em", lineHeight:1, flexShrink:0 }}>SPV</span>}
                {tieneSR  && <span title="Lleva Servicios Reunidos" style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:"22px", height:"22px", borderRadius:"4px", background:"#F59E0B", color:"#111116", fontSize:"9px", fontWeight:900, letterSpacing:"0.02em", lineHeight:1, flexShrink:0 }}>SR</span>}
              </>;
            })()}
            {c.optimizada === false && (
              <span title="Carga no optimizada" style={{ fontSize:"18px", lineHeight:1, filter:"saturate(0) brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5) brightness(1.2)" }}>⚙️</span>

            {incids.map((inc,i) => { const info = INCIDENCIAS.find(x => x.id===inc.tipo); return info ? <span key={i} style={{ fontSize:"18px", lineHeight:1 }} title={info.label}>{info.icon}</span> : null; })}
            {alerta && <span style={{ fontSize:"22px", lineHeight:1, opacity:0.9 }}>🚨</span>}
          </div>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:"6px" }}>
            <span style={{ color:"#FFFFFF", fontWeight:800, fontSize:"13px", fontFamily:"'DM Mono',monospace" }}>{c.nTransp}</span>
            {c.fechaEnt && (
              <span style={{ fontSize:"10px", fontWeight:700, color: fechaColor, background: fechaColor+"22", borderRadius:"4px", padding:"1px 6px", border:`1px solid ${fechaColor}44` }}>
                📅 {c.fechaEnt}
              </span>

          </div>
          <div style={{ color:"#F3F4F6", fontWeight:600, fontSize:"11px", lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.cliente}</div>
          <div style={{ color: esAgenciaPrioritaria(c.transport) ? "#fbbf24" : "#E5E7EB", fontSize:"10px", fontWeight: esAgenciaPrioritaria(c.transport) ? 700 : 400 }}>{c.transport}</div>
        </div>

    // Sección colapsable con grid de columnas

            <span style={{ color, fontWeight:800, fontSize:"13px", flex:1, letterSpacing:"0.05em" }}>{lbl}</span>
            <span style={{ background:color+"22", color, border:`1px solid ${color}44`, borderRadius:"9999px", padding:"2px 12px", fontSize:"12px", fontWeight:800 }}>{items.length + itemsAyer.length}</span>
          </div>
          {isOpen && (
            <div style={{ padding:"10px 12px" }}>
              {/* Arrastrados día anterior primero */}
              {itemsAyer.length > 0 && (
                <div style={{ marginBottom:"10px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"6px" }}>
                    <span style={{ color:"#F59E0B", fontWeight:800, fontSize:"13px" }}>📅 Arrastrados día anterior</span>
                    <span style={{ color:"#F59E0B", fontSize:"12px", fontWeight:700, background:"#F59E0B15", border:"1px solid #F59E0B44", borderRadius:"9999px", padding:"1px 8px" }}>{itemsAyer.length}</span>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(180px, 1fr))", gap:"8px" }}>
                    {itemsAyer.map(c => <CamionCard key={"ayer_"+c.nTransp} c={c} color={color} />)}
                  </div>
                  {sorted.length > 0 && <div style={{ borderBottom:"1px dashed #2A2A35", margin:"10px 0" }}/>}
                </div>
              )}
              {sorted.length === 0 && itemsAyer.length === 0
                ? <div style={{ color:"#606070", fontSize:"11px", fontStyle:"italic", padding:"8px" }}>Sin camiones</div>
                : (() => {
                    // Agrupar por fecha
                    const grupos = {};
                    sorted.forEach(c => {
                      const key = c.fechaEnt || "Sin fecha";
                      if (!grupos[key]) grupos[key] = [];
                      grupos[key].push(c);
                    });
                    const hoy = new Date(); hoy.setHours(0,0,0,0);
                    const getColor = (fechaStr) => {
                      if (!fechaStr || fechaStr === "Sin fecha") return "#52525B";
                      const [d,m,y] = fechaStr.split("/");
                      const fecha = new Date(`20${y}-${m}-${d}`);
                      const diff = Math.round((fecha - hoy) / 86400000);
                      if (diff < 0) return "#ef4444";
                      if (diff === 0) return "#4ade80";
                      if (diff === 1) return "#38BDF8";
                      return "#fb923c";
                    };
                    return Object.entries(grupos).map(([fecha, items]) => {
                      const col = getColor(fecha);
                      return (
                        <div key={fecha} style={{ marginBottom:"10px" }}>
                          <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"6px" }}>
                            <span style={{ color:"#FFFFFF", fontWeight:800, fontSize:"13px", letterSpacing:"0.05em" }}><span style={{ fontSize:"15px" }}>📅</span> {fecha}</span>
                            
                            <span style={{ color:"#FFFFFF", fontSize:"12px", fontWeight:700, background:col+"15", border:`1px solid ${col}44`, borderRadius:"9999px", padding:"1px 8px" }}>{items.length}</span>

                          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:"6px" }}>

    return (

        <div style={{ display:"flex", alignItems:"center", gap:"16px", marginBottom:"16px", flexWrap:"wrap" }}>
          <label style={{ ...C.btn(fac.color), cursor:"pointer", fontSize:"11px" }}>
            📂 CARGAR EXCEL
            <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}
              onChange={e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => parseCargasXlsx(ev.target.result, fac.id);

              }} />
          </label>
          {cargasFecha[fac.id] && <span style={{ fontSize:"11px", color:"#E5E7EB" }}>Cargado {cargasFecha[fac.id]}</span>}
          <label style={{ background:"#2D2D3A", color:"#9CA3AF", fontWeight:700, border:"1px solid #3F3F46", borderRadius:"8px", padding:"7px 14px", cursor:"pointer", display:"inline-block", fontSize:"12px", fontFamily:"inherit" }}>
            📅 Día anterior
            <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}

          </label>
          {cargasAyerFecha[fac.id] && <span style={{ fontSize:"11px", color:"#9CA3AF" }}>Ayer: {cargasAyerFecha[fac.id]}</span>}

          {/* Leyenda colores */}
          <div style={{ display:"flex", gap:"8px", alignItems:"center", marginLeft:"8px", background:"#16161C", border:"1px solid #2A2A35", borderRadius:"8px", padding:"5px 12px", flexWrap:"wrap" }}>
            {[
              { color:"#ef4444", label:"Fecha pasada" },
              { color:"#4ade80", label:"Hoy" },

              </div>
            ))}
          </div>

          {/* KPIs inline */}
          {[
            { lbl:"TOTALES",     val: cd ? cd.total : "—",          color: fac.color },
            { lbl:"ARRASTRADOS", val: cargasAyer[fac.id]?.length || "—", color:"#EF4444" },
            { lbl:"PENDIENTES",  val: cd ? cd.pendientes : "—",      color:"#EF4444" },
            { lbl:"NOCTURNAS",   val: fd.transporteMeta?.nocturnas||"—", color:"#8B5CF6", manual:true },
          ].map(({lbl,val,color,manual}) => (
            <div key={lbl} style={{ background:"#16161C", borderRadius:"8px", padding:"6px 14px", textAlign:"center", border:"1px solid #2A2A35", minWidth:"80px" }}>
              <div style={{ fontSize:"9px", color:"#E5E7EB", fontWeight:700, letterSpacing:"0.1em", marginBottom:"4px" }}>{lbl}</div>
              {manual
                ? <input type="number" placeholder="—"
                    style={{ background:"transparent", border:"none", color, fontSize:"22px", fontWeight:800, textAlign:"center", width:"60px", outline:"none", fontFamily:"inherit" }}
                    value={fd.transporteMeta?.nocturnas||""}
                    onChange={e => { const u = { ...dayData, [fac.id]: { ...dayData[fac.id], transporteMeta: { ...(dayData[fac.id].transporteMeta||{}), nocturnas: e.target.value }}}; setDayData(u); }} />
                : <div style={{ fontSize:"22px", fontWeight:800, color }}>{val}</div>
              }
            </div>
          ))}
        </div>

        {/* Secciones con grid */}
        {cd && (<>
          {(() => {
            const ayer = cargasAyer[fac.id] || [];
            const hasSystoreA = ayer.some(c => c.systore !== null);
            const isEnCargaA    = (c) => hasSystoreA ? (c.systore === 3 && [2,3].includes(c.status)) : c.status === 3;
            const isRegistradoA = (c) => hasSystoreA ? (c.status === 2 && [1,2].includes(c.systore)) : c.status === 2;
            const isPendienteA  = (c) => hasSystoreA ? (c.status === 1 && [1,2].includes(c.systore)) : c.status === 1;
            const ayerPendientes  = ayer.filter(c => isPendienteA(c));
            const ayerRegistrados = ayer.filter(c => isRegistradoA(c));
            const ayerEnCarga     = ayer.filter(c => isEnCargaA(c));
            return <>
              <SeccionGrid secKey="pendientes"  lbl="⏳ Pendientes"       items={cd.pendientes_list} color="#F59E0B" itemsAyer={ayerPendientes} />
              <SeccionGrid secKey="registrados" lbl="🕐 Registrados"      items={cd.registrados}     color="#38BDF8" itemsAyer={ayerRegistrados} />
              <SeccionGrid secKey="enCarga"     lbl="🔄 En carga"         items={cd.enCarga}         color="#22C55E" itemsAyer={ayerEnCarga} />
              <SeccionGrid secKey="finCarga"    lbl="✅ Carga finalizada" items={cd.finCarga}        color="#EF4444" />
            </>;
          })()}
        </>)}

      </div>
    );
  };

  const parseSAPXlsx = (arrayBuffer, fid) => {
    try {
      const wb = XLSX.read(arrayBuffer, { type:"array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
      const toNum = (v) => {
        if (v === null || v === undefined || v === "") return 0;
        const s = String(v).replace(/\./g,"").replace(",",".");
        return parseFloat(s) || 0;
      };

      // Build header row: col index -> code string
      const codes = {};
      for (let c = 1; c <= range.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({r:0, c})];
        if (cell) {
          const v = cell.v;
          const code = Number.isInteger(v) ? String(v).padStart(4,"0")
                     : typeof v === "number" ? String(Math.round(v)).padStart(4,"0")
                     : String(v).trim();
          codes[c] = code;
        }
      }

      // Find rows by label
      const getRow = (label) => {
        for (let r = 1; r <= range.e.r; r++) {
          const cell = ws[XLSX.utils.encode_cell({r, c:0})];
          if (cell && String(cell.v).includes(label)) {
            const row = {};
            for (let c = 1; c <= range.e.c; c++) {
              const rc = ws[XLSX.utils.encode_cell({r, c})];
              row[c] = rc ? rc.v : null;
            }
            return row;
          }
        }
        return {};
      };

      const pedidosRow = getRow("TOTAL PEDIDOS");
      const fisicoRow  = getRow("FÍSICO");
      const disponRow  = getRow("DISPONIBLE");
      const bloqRow    = getRow("BLOQUEADO");

      const allStocks = {};
      const todosArticulos = Object.entries(codes).map(([col, cod]) => {
        const p = toNum(pedidosRow[col]);
        const f = toNum(fisicoRow[col]);
        const b = toNum(bloqRow[col]);
        const d = toNum(disponRow[col]);
        allStocks[cod] = { pedidos:p, fisico:f, dispon:d, bloq:b };
        return { cod, pedidos:p, fisico:f, dispon:d, bloq:b, trans:0, diff: f-b-p };
      });
      const criticos = todosArticulos.filter(r => r.diff <= 0 && r.pedidos > 0)
        .sort((a,b) => { const aNum=/^\d+$/.test(a.cod), bNum=/^\d+$/.test(b.cod); if(aNum&&!bNum)return -1; if(!aNum&&bNum)return 1; if(aNum&&bNum)return parseInt(a.cod)-parseInt(b.cod); return a.cod.localeCompare(b.cod); });

      const hora = new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
      const updated = { ...dayData, [fid]: { ...dayData[fid], sapCriticos: criticos, sapStockMap: allStocks, sapFecha: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}), pedidosMap: {}, pedidosFecha: "", sapLlenado: {} }};
      saveData(updated);
      showSaved("✓ Stocks " + FACTORIES.find(f=>f.id===fid).label + ": " + criticos.length + " críticos");
    } catch(e) { console.error("parseSAPXlsx error:", e); showSaved("⚠️ Error al leer stocks: " + e.message); }
  };

  const parseSAPXml = (xmlText, fid) => {
    const text = xmlText.replace(/^\uFEFF/, "");
    const rowRegex = /<Row[^>]*>([\s\S]*?)<\/Row>/g;
    const rows = [];
    let m;
    while ((m = rowRegex.exec(text)) !== null) rows.push(m[1]);
    if (rows.length < 3) { showSaved("⚠️ Formato no reconocido"); return; }

    const toNum = (s) => parseFloat((s||"0").replace(/\./g,"").replace(",",".")) || 0;

    // Parse row counting self-closing empty cells as column placeholders
    const parseByCol = (row) => {
      const map = {};
      let cur = 1;
      // Replace self-closing cells with placeholder so they consume a column
      const expanded = row.replace(/<Cell([^>]*)\/>/g, '<Cell$1><Data ss:Type="String">__MT__</Data></Cell>');
      const re = /<Cell([^>]*)>([\s\S]*?)<\/Cell>/g;
      let cm;
      while ((cm = re.exec(expanded)) !== null) {
        const ix = cm[1].match(/ss:Index="(\d+)"/);
        if (ix) cur = parseInt(ix[1]);
        const dm = cm[2].match(/<Data[^>]*>([\s\S]*?)<\/Data>/);
        const val = dm ? dm[1].trim() : null;
        if (val && val !== "__MT__") map[cur] = val;
        cur++;
      }
      return map;
    };

    const codesMap   = parseByCol(rows[0]);
    const pedidosMap = parseByCol(rows[1]);
    const fisicoMap  = parseByCol(rows[2]);
    const disponMap  = parseByCol(rows[3]);
    const bloqMap    = parseByCol(rows.length > 6 ? rows[6] : "");
    const transMap   = parseByCol(rows.length > 7 ? rows[7] : "");

    const codes = Object.entries(codesMap)
      .filter(([c]) => parseInt(c) > 1)
      .sort((a,b) => parseInt(a[0]) - parseInt(b[0]));

    const allStocks2 = {};
    const criticos = codes.map(([col, cod]) => {
      const p = toNum(pedidosMap[col]);
      const f = toNum(fisicoMap[col]);
      const b = toNum(bloqMap[col]);
      const t = toNum(transMap[col]);
      const d = toNum(disponMap[col]);
      allStocks2[cod] = { pedidos:p, fisico:f, dispon:d, bloq:b };
      return { cod, pedidos: p, fisico: f, dispon: d, bloq: b, trans: t, diff: f - b - p };
    }).filter(r => r.diff <= 0 && r.pedidos > 0)
      .sort((a,b) => { const aNum=/^\d+$/.test(a.cod), bNum=/^\d+$/.test(b.cod); if(aNum&&!bNum)return -1; if(!aNum&&bNum)return 1; if(aNum&&bNum)return parseInt(a.cod)-parseInt(b.cod); return a.cod.localeCompare(b.cod); });

    const updated = { ...dayData, [fid]: { ...dayData[fid], sapCriticos: criticos, sapStockMap: allStocks2, sapFecha: new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) }};
    saveData(updated);
    showSaved("✓ SAP " + FACTORIES.find(f=>f.id===fid).label + ": " + criticos.length + " críticos");
  };

  // ── Pedidos parser (xlsx) ────────────────────────────────────────
  const parsePedidosXlsx = (arrayBuffer, fid) => {
    try {
      const wb = XLSX.read(arrayBuffer, { type:"array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
      if (rows.length < 2) return;
      // Flexible column search - handles slight name variations
      // Build header map from all cells in row 1
      const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
      const header = [];
      for (let c = range.s.c; c <= range.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({r:0, c})];
        header.push(cell ? String(cell.v).trim() : "");
      }
      const findCol = (names) => { for(const n of names){ const idx = header.findIndex(h => h && h.toLowerCase().includes(n.toLowerCase())); if(idx>=0) return idx; } return -1; };
      const iCliente    = findCol(["Nombre Destinatario","destinatario"]);
      const iTransp     = findCol(["Transp.","Transporte"]);
      const iFecha      = findCol(["Fec.Pedido","Fecha Pedido","fec.pedido","fecha pedido"]);
      const iHora       = findCol(["Hora Carga","hora carga"]);
      const iFechaCarga = findCol(["Fech.Carga","Fecha Carga","fech.carga","fecha carga"]);
      const iHoraCarga  = findCol(["Hora Carga","hora carga"]);
      console.log("Cols - Cliente:",iCliente,"Transporte:",iTransp,"Fecha:",iFecha,"HoraCarga:",iHoraCarga,"FechaCarga:",iFechaCarga,"TotalCols:",header.length);
      // Find product code columns (4-digit numeric or letter codes)
      const prodCols = {};
      header.forEach((h, idx) => {
        if (/^\d{4}$/.test(h) || /^[A-Z]\d{3}$/.test(h)) prodCols[h] = idx;
      });
      // Build map: code -> [{cliente, transporte, fecha, qty}]
      const map = {};
      rows.slice(1).forEach(row => {
        const cliente    = row[iCliente]  ? String(row[iCliente]).trim()  : "";
        const transporte = row[iTransp]   ? String(row[iTransp]).trim()   : "";
        const rawFecha   = row[iFecha];
        const fecha      = (() => {
          if (!rawFecha) return "";
          if (rawFecha instanceof Date) return rawFecha.toLocaleDateString("es-ES");
          if (typeof rawFecha === "number") {
            const d = new Date(Math.round((rawFecha - 25569) * 86400 * 1000));
            return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${d.getUTCFullYear()}`;
          }
          return String(rawFecha).trim();
        })();
        const hora       = row[iHora]     ? String(row[iHora]).trim()     : "";
        const rawFechaCarga = iFechaCarga >= 0 ? row[iFechaCarga] : null;
        const fechaCarga = (() => {
          if (!rawFechaCarga) return "";
          if (rawFechaCarga instanceof Date) {
            const d = String(rawFechaCarga.getDate()).padStart(2,"0");
            const m = String(rawFechaCarga.getMonth()+1).padStart(2,"0");
            return `${d}/${m}/${rawFechaCarga.getFullYear()}`;
          }
          if (typeof rawFechaCarga === "number") {
            const dt = new Date(Math.round((rawFechaCarga - 25569) * 86400 * 1000));
            const d = String(dt.getUTCDate()).padStart(2,"0");
            const m = String(dt.getUTCMonth()+1).padStart(2,"0");
            return `${d}/${m}/${dt.getUTCFullYear()}`;
          }
          return String(rawFechaCarga).trim();
        })();
        const tramo      = iHoraCarga >= 0 && row[iHoraCarga] ? String(row[iHoraCarga]).trim() : "";
        Object.entries(prodCols).forEach(([cod, ci]) => {
          const qty = row[ci];
          if (qty && qty !== 0) {
            if (!map[cod]) map[cod] = [];
            const qtyNum = typeof qty === "number" ? qty : parseFloat(String(qty).replace(",","."));
            if (!isNaN(qtyNum) && qtyNum > 0) map[cod].push({ cliente, transporte, fecha, hora, fechaCarga, tramo, qty: qtyNum });
          }
        });
      });
      const hora = new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
      const updated = { ...dayData, [fid]: { ...dayData[fid], pedidosMap: map, pedidosFecha: hora }};
      saveData(updated);
      showSaved("✓ Pedidos cargados " + hora);
    } catch(e) { console.error("Pedidos parse error:", e); showSaved("⚠️ Error al leer pedidos"); }
  };


  const renderStocksFac = (facId) => {
    const fac = FACTORIES.find(f => f.id === facId);
    const fd = dayData[fac.id] || {};
    const criticos = sortCriticos(fd.sapCriticos || []);

    return (

          <label style={{ background:"#FFFFFF", color:"#111116", fontWeight:800, border:"none", borderRadius:"8px", padding:"7px 16px", cursor:"pointer", display:"inline-block", fontSize:"12px", fontFamily:"inherit" }}>
            📂 CARGAR STOCKS
            <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}
              onChange={e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => parseSAPXlsx(ev.target.result, fac.id);
                reader.readAsArrayBuffer(file);
                e.target.value = "";
              }} />
          </label>
          <label style={{ background:"#FFFFFF", color:"#111116", fontWeight:800, border:"none", borderRadius:"8px", padding:"7px 16px", cursor:"pointer", display:"inline-block", fontSize:"12px", fontFamily:"inherit" }}>
            📋 CARGAR PEDIDOS
            <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}
              onChange={e => {
                const file = e.target.files[0]; if (!file) return;

          {fd.pedidosFecha && <span style={{ fontSize:"11px", color:"#c4b5fd" }}>Pedidos: {fd.pedidosFecha}</span>}


          {fd.sapFecha && <span style={{ fontSize:"11px", color:"#F9FAFB" }}>Cargado {fd.sapFecha}</span>}

          {/* Sub-pestañas */}
          {criticos.length > 0 && (() => {
            const rojos  = criticos.filter(r => r.diff < 0).length;

                  { id:"ambar", label:`< ${umbralAlerta} pal.`, count:ambars,  dot:"#D946EF", color:"#D946EF", bg:"#140a00", border:"#D946EF" },
                  { id:"todos", label:"Todos",          count:criticos.length, dot:"#9CA3AF", color:"#9CA3AF", bg:"#111116", border:"#9CA3AF" },
                ].map(t => {
                  const active = tab===t.id;
                  return (
                    <button key={t.id} onClick={() => setStocksSubTab(p => ({...p, [facId]: t.id}))}
                      style={{
                        background: active ? t.color+"28" : "#16161C",
                        border:`2px solid ${active ? t.color : "#2A2A35"}`,
                        borderRadius:"8px", padding:"6px 16px", cursor:"pointer", fontFamily:"inherit",
                        color: active ? "#FFFFFF" : "#9CA3AF",
                        fontWeight: active ? 800 : 600, fontSize:"12px",
                        display:"flex", alignItems:"center", gap:"6px",
                        boxShadow: active ? `0 0 10px ${t.color}44` : "none",
                        transition:"all 0.15s"
                      }}>
                      <span style={{ display:"inline-block", width: active?"9px":"7px", height: active?"9px":"7px", borderRadius:"50%", background: active ? t.dot : "#52525B", flexShrink:0, transition:"all 0.15s" }}/>
                      <span style={{ color: active ? "#E5E7EB" : "#9CA3AF" }}>{t.label}:</span>
                      <span style={{ fontWeight:900, color: active ? t.color : "#6B7280" }}>{t.count}</span>
                    </button>
                  );
                })}
              </div>
            );
          })()}
        </div>

        {/* Critical stocks table — full width */}
        {criticos.length > 0 && (
          <div style={{ overflow:"auto", flex:1, marginBottom:"16px" }}>
            <table style={{ width:"100%", minWidth:"900px", borderCollapse:"collapse", fontSize:"12px", tableLayout:"auto" }}>
              <colgroup>
                <col style={{ width:"45px" }}/>
                <col style={{ width:"45px" }}/>
                <col style={{ width:"50px" }}/>
                <col style={{ width:"55px" }}/>
                <col style={{ width:"55px" }}/>
                <col style={{ width:"45px" }}/>
                <col style={{ width:"55px" }}/>
                <col style={{ width:"70px" }}/>
                <col/>
              </colgroup>
              <thead style={{ position:"sticky", top:0, zIndex:5 }}>
                <tr style={{ borderBottom:"2px solid #606070", background:"#202028" }}>
                  {["Código","Pedidos","Físico","Disponible","Bloqueado","Tránsito","Diferencia","Plan / Situación","Clientes afectados"].map((h,hi) => (
                    <th key={h} style={{ padding:"6px 6px", textAlign: hi < 7 ? "right" : "left", color:"#F9FAFB", fontWeight:700, whiteSpace:"nowrap", fontSize:"11px", ...(h==="Plan / Situación" ? {width:"70px", minWidth:"70px"} : {}) }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {criticos.filter(r => {
                    const tab = stocksSubTab[facId] || "rojo";
                    if (tab === "todos") return true;
                    if (tab === "rojo")  return r.diff < 0;
                    if (tab === "azul")  return r.diff === 0;
                    if (tab === "ambar") return r.diff > 0 && r.diff <= umbralAlerta;
                    return true;
                  }).map((r,i) => {
                  const diff = r.diff;
                  const llenado = fd.sapLlenado?.[r.cod] || {};
                  const plan = getPlanForCod(r.cod);
                  const situ = llenado.situacion || "";
                  const updateLlenado = (field, val) => {
                    const updated = { ...dayData, [fac.id]: { ...dayData[fac.id], sapLlenado: { ...(dayData[fac.id].sapLlenado||{}), [r.cod]: { ...(dayData[fac.id].sapLlenado?.[r.cod]||{}), [field]: val } } } };
                    saveData(updated);
                  };
                  const rowBg = situ ? situBg[situ] : (i%2===0 ? "#0D0D0F" : "transparent");
                  const grupoBg = situ ? situBg[situ] : "#111113";
                  const grupoTxt = situ ? situTxt[situ] : "#F3F4F6";
                  const grupoBrd = situ ? situBorder[situ] : "#3F3F46";
                  return (
                    <React.Fragment key={i}>
                    <tr style={{ borderBottom:"1px solid #44444F", background: rowBg }}>

                      <td style={{ padding:"4px 6px", color:"#EF4444", fontWeight:700, textAlign:"right" }}>{(diff??0).toFixed(2)}</td>

                        <td style={{ padding:"4px 6px", verticalAlign:"top", width:"70px", minWidth:"70px" }}>

                              {(() => { const gStr = String(p.grupo||"").replace(/\s+/g," ").trim(); const m = gStr.match(/^(GRUPO)\s*(\d+)$/i); return m ? (

                              ) : <span style={{ color:"#6ee7a0", fontWeight:700, fontSize:"9px" }}>{gStr}</span>; })()}
                              <div style={{ display:"flex", flexDirection:"column", gap:"2px", alignItems:"flex-start" }}>

                          ))}
                          <div style={{ marginTop: plan.length > 0 ? "3px" : "0" }}>
                            <select
                              style={{ background: situ ? situBg[situ] : "#1A1A20", border:"1px solid "+(situ ? situBorder[situ] : "#3F3F46"), borderRadius:"4px", color: situ ? situTxt[situ] : "#9CA3AF", padding:"3px 4px", fontSize:"11px", outline:"none", cursor:"pointer", fontWeight: situ ? 700 : 400, width:"100%" }}
                              value={situ}
                              onChange={e => updateLlenado("situacion", e.target.value)}
                            >
                              <option value="" style={{ background:"#1A1A2E", color:"#9CA3AF" }}>—</option>
                              {situOpciones.map(s => <option key={s.label} value={s.label} style={{ background:"#1A1A2E", color:"#E5E7EB" }}>● {s.label}</option>)}
                            </select>
                            <select
                              style={{ background: situ ? situBg[situ]+"99" : "#1A1A20", border:"1px solid "+(situ ? situBorder[situ] : "#3F3F46"), borderRadius:"4px", color: situ ? situTxt[situ] : "#9CA3AF", padding:"2px 4px", fontSize:"10px", outline:"none", cursor:"pointer", marginTop:"3px", width:"100%" }}
                              value={llenado.detalle||""}

                      <td style={{ padding:"3px 4px" }}>

                              // filaExpandida: si showClientes=true, por defecto expandida (undefined = expanded)

                                              <span style={{ color:"#fcd34d", fontWeight:700 }}>{c.qty}</span>
                                              <span style={{ color:"#9CA3AF", whiteSpace:"nowrap" }}>{c.hora}</span>
                                              <span style={{ color:"#38BDF8", whiteSpace:"nowrap", fontWeight:600 }}>{c.transporte}</span>
                                              <span style={{ color:"#F3F4F6", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{c.cliente}</span>

                                      ))}
                                    </div>

                                </div>
                              );

                      </td>
                    </tr>
                    </React.Fragment>

        )}
        {criticos.length === 0 && fd.sapFecha && (
          <div style={{ background:"#052e16", border:"1px solid #16a34a", borderRadius:"6px", padding:"8px 12px", marginBottom:"12px", fontSize:"12px", color:"#4ade80" }}>
            ✓ Sin referencias críticas
          </div>
        )}


      </div>
    );
  };

  const renderAlmacen = () => {
    const fac = FACTORIES[0]; // Solo A Grela
    const fd = dayData[fac.id] || {};
    const celdas = fd.celdas || [];
    const addCelda = async () => {

            </div>
            <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>

              <label style={{ ...C.btn("#D946EF"), cursor:"pointer", display:"inline-block", fontSize:"12px" }}>

            </div>

          {pasilloData && pasilloAfectados.length > 0 && (

                    const totalPed = Math.round(pedG.reduce((s,p) => s + (Number(p.qty)||0), 0) * 100) / 100;

                        {pasillos.map(p => (<React.Fragment key={p}>

                        <th style={{ padding:"6px 8px", textAlign:"right", color:"#86efac", fontWeight:700, fontSize:"11px", background:"#051a0f", borderRight:"2px solid #14532d", whiteSpace:"nowrap" }}>Accesible</th>
                        <th style={{ padding:"6px 8px", textAlign:"right", color:"#c4b5fd", fontWeight:700, fontSize:"11px", background:"#150d2e", borderLeft:"2px solid #4c1d95", borderRight:"2px solid #4c1d95", whiteSpace:"nowrap" }}>Pedidos</th>
                        <th style={{ padding:"6px 8px", textAlign:"right", color:"#F9FAFB", fontWeight:700, fontSize:"11px", whiteSpace:"nowrap" }}>Diferencia</th>

                  </thead>
                  <tbody>
                    {pasilloAfectados.filter(a => {
                      if (pasilloFiltro === "criticos") return a.yaCritico;
                      if (pasilloFiltro === "rompen" || pasilloFiltro === "nuevos") {
                        const pedG = dayData["agrela"]?.pedidosMap?.[a.cod] || [];
                        const totalPed = Math.round(pedG.reduce((s,p) => s + (Number(p.qty)||0), 0) * 100) / 100;
                        const sapMap = dayData["agrela"]?.sapStockMap || {};
                        const stockEntry = sapMap[a.cod] || dayData["agrela"]?.sapCriticos?.find(r => r.cod === a.cod);
                        const stockTotal = stockEntry ? Number(stockEntry.dispon ?? stockEntry.libre ?? 0) : null;
                        const udsPale = a.udsPale || null;
                        const paletsPasillo = (a.paletsTotalesCompletos||0) > 0 ? a.paletsTotalesCompletos : (udsPale && a.stock ? Math.floor(a.stock / udsPale) : null);
                        const stockAccesible = stockTotal !== null && paletsPasillo !== null ? Math.round((stockTotal - paletsPasillo) * 100) / 100 : null;
                        const diferencia = stockAccesible !== null ? Math.round((stockAccesible - totalPed) * 100) / 100 : null;
                        const rompePorPasillo = !a.yaCritico && diferencia !== null && diferencia < 0;
                        if (pasilloFiltro === "rompen") return rompePorPasillo;
                        if (pasilloFiltro === "nuevos") return a.nuevoCritico && !rompePorPasillo;
                      }
                      return true;
                    }).map((a, idx) => {
                      const pedG = dayData["agrela"]?.pedidosMap?.[a.cod] || [];
                      const totalPed = Math.round(pedG.reduce((s,p) => s + (Number(p.qty)||0), 0) * 100) / 100;
                      const numPed = pedG.length;
                      // Buscar stock en sapStockMap (todos los artículos SAP cargados hoy)
                      const sapMap = dayData["agrela"]?.sapStockMap || {};
                      const stockEntry = sapMap[a.cod] || dayData["agrela"]?.sapCriticos?.find(r => r.cod === a.cod);
                      const stockTotal = stockEntry ? Number(stockEntry.dispon ?? stockEntry.libre ?? 0) : null;
                      // Solo pales completos restan del stock accesible
                      const udsPale = a.udsPale || null;
                      const paletsPasillo = (a.paletsTotalesCompletos||0) > 0 ? a.paletsTotalesCompletos
                        : (udsPale && a.stock ? Math.floor(a.stock / udsPale) : null);
                      // Stock accesible en palets = stock total - palets pasillo
                      const stockAccesible = stockTotal !== null && paletsPasillo !== null ? Math.round((stockTotal - paletsPasillo) * 100) / 100 : null;
                      const diferencia = stockAccesible !== null ? Math.round((stockAccesible - totalPed) * 100) / 100 : null;
                      // Rompe por pasillo: no era crítico pero sí lo es con el pasillo bloqueado
                      const rompePorPasillo = !a.yaCritico && diferencia !== null && diferencia < 0;
                      const rowBg = a.yaCritico ? "#1a0505" : rompePorPasillo ? "#1a1100" : (idx%2===0 ? "#111113" : "transparent");
                      return (
                        <tr key={a.cod} style={{ borderBottom:"1px solid #2A2A35", background: rowBg }}>

                            {a.yaCritico
                              ? <span style={{ background:"#450a0a", border:"1px solid #ef4444", borderRadius:"4px", padding:"2px 7px", color:"#fca5a5", fontSize:"10px", fontWeight:700 }}>🔴 Ya crítico</span>
                              : rompePorPasillo
                                ? <span style={{ background:"#2d1800", border:"1px solid #f97316", borderRadius:"4px", padding:"2px 7px", color:"#fdba74", fontSize:"10px", fontWeight:700 }}>🟠 Rompe</span>
                                : <span style={{ background:"#422006", border:"1px solid #f59e0b", borderRadius:"4px", padding:"2px 7px", color:"#fcd34d", fontSize:"10px", fontWeight:700 }}>🟡 Nuevo</span>
                            }
                          </td>
                          <td style={{ padding:"6px 8px", fontFamily:"'JetBrains Mono',monospace", color:"#D946EF", fontWeight:700 }}>{a.cod}</td>
                          <td style={{ padding:"6px 8px", color:"#F3F4F6", maxWidth:"220px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{a.desc}</td>
                          {/* Columnas por pasillo - pales completos + picking */}
                          {Array.from(new Set(Object.values(pasilloData.articulos).flatMap(x => Object.keys(x.porPasillo||{})))).sort().map(p => {

                            return (<React.Fragment key={p}>
                              <td style={{ padding:"6px 8px", background:"#0a1628", borderLeft:"2px solid #1e3a5f", textAlign:"right" }}>
                                {sinCatalogo
                                  ? <span style={{ color:"#ef4444", fontSize:"10px" }}>⚠️</span>

                                      </span>
                                    : <span style={{ color:"#52525B" }}>—</span>}
