            <div style={{ maxWidth:"600px", margin:"0 auto" }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"16px" }}>
                <div style={{ fontWeight:700, color:"#F3F4F6", fontSize:"15px" }}>⚖️ Pesos Máximos por Agencia</div>
                <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>
                  <label style={{ background:"#FFFFFF", color:"#111116", fontWeight:800, border:"none", borderRadius:"8px", padding:"7px 16px", cursor:"pointer", display:"inline-block", fontSize:"12px", fontFamily:"inherit" }}>
                    📂 Cargar Excel
                    <input type="file" accept=".xlsx,.xls" style={{ display:"none" }}
                      onChange={e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = ev => parsePesosAgenciaXlsx(ev.target.result); reader.readAsArrayBuffer(file); e.target.value=""; }} />
                  </label>
                  {Object.keys(pesosAgencia).length > 0 && (
                    <button onClick={() => savePesosAgencia({})} style={{ background:"#3d0f0f", border:"none", color:"#fca5a5", borderRadius:"6px", padding:"7px 12px", cursor:"pointer", fontSize:"12px", fontFamily:"inherit" }}>🗑️ Borrar todo</button>
                  )}
                </div>
              </div>
              <div style={{ fontSize:"12px", color:"#9CA3AF", marginBottom:"12px" }}>
                Formato Excel: columna A = Agencia, columna B = Peso máximo (KG). La fila 1 es la cabecera.
              </div>
              {Object.keys(pesosAgencia).length === 0
                ? <div style={{ color:"#606070", textAlign:"center", padding:"40px", fontSize:"13px" }}>Carga el Excel con los pesos máximos por agencia</div>
                : <>
                    <div style={{ fontSize:"11px", color:"#4ade80", marginBottom:"10px" }}>✓ {Object.keys(pesosAgencia).length} agencias cargadas</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:"4px" }}>
                      {Object.entries(pesosAgencia).map(([ag, max]) => (
                        <div key={ag} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", background:"#1A1A24", border:"1px solid #2A2A35", borderRadius:"6px", padding:"8px 14px" }}>
                          <span style={{ color:"#E5E7EB", fontSize:"13px" }}>{ag}</span>
                          <span style={{ color:"#F59E0B", fontWeight:700, fontSize:"13px", fontFamily:"'DM Mono',monospace" }}>{max.toLocaleString("es-ES")} KG</span>
                        </div>
                      ))}
                    </div>
                    {/* Diagnóstico comparación con cargas actuales */}
                    {(() => {
                      const todos = cargasData[activeFab]?.todos || [];
                      const agencias = [...new Set(todos.map(c => c.transport).filter(Boolean))];
                      if (!agencias.length) return (
                        <div style={{ marginTop:"16px", color:"#606070", fontSize:"12px", fontStyle:"italic" }}>
                          Carga el Excel de Cargas para ver el diagnóstico de coincidencias.
                        </div>
                      );
                      return (
                        <div style={{ marginTop:"16px", background:"#111118", border:"1px solid #3F3F46", borderRadius:"8px", padding:"12px" }}>
                          <div style={{ fontSize:"11px", color:"#F59E0B", fontWeight:700, marginBottom:"8px" }}>🔍 Agencias sin coincidencia en cargas actuales</div>
                          <div style={{ display:"flex", flexDirection:"column", gap:"4px" }}>
                            {agencias.filter(ag => !getPesoMaxAgencia(ag)).length === 0
                              ? <div style={{ color:"#4ade80", fontSize:"12px" }}>✓ Todas las agencias tienen peso máximo configurado</div>
                              : agencias.filter(ag => !getPesoMaxAgencia(ag)).map(ag => (
                                <div key={ag} style={{ display:"flex", gap:"8px", fontSize:"12px", alignItems:"center", padding:"3px 0", borderBottom:"1px solid #1E1E2A" }}>
                                  <span style={{ color:"#ef4444", fontWeight:700 }}>✗</span>
                                  <span style={{ color:"#E5E7EB", flex:1 }}>{ag}</span>
                                  <span style={{ color:"#9CA3AF" }}>Sin coincidencia</span>
                                </div>
                              ))
                            }
                          </div>
                        </div>
                      );
                    })()}
                  </>
              }
            </div>
          )}

          {configTab === "prioridades" && (() => {
            const PrioTab = () => {
              const [nueva, setNueva] = React.useState("");
              const agregar = () => {
                const ag = nueva.trim().toUpperCase();
                if (!ag || agenciasPrioritarias.includes(ag)) return;
                saveAgenciasPrioritarias([...agenciasPrioritarias, ag]);
                setNueva("");
              };
              // Agencias disponibles de cargas actuales
              const enCargas = [...new Set([
                ...(cargasData["agrela"]?.todos||[]).map(c=>c.transport),
                ...(cargasData["moras"]?.todos||[]).map(c=>c.transport)
              ].filter(Boolean))].sort();

              return (
                <div style={{ maxWidth:"600px", margin:"0 auto" }}>
                  <div style={{ fontWeight:700, color:"#F3F4F6", fontSize:"15px", marginBottom:"6px", display:"flex", alignItems:"center", gap:"8px" }}><svg width="20" height="20" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="11" fill="#ef4444"/><polygon points="12.5,3 7,12 11,12 9.5,19 15,10 11,10" fill="#fbbf24"/></svg> Agencias Prioritarias</div>
                  <div style={{ color:"#9CA3AF", fontSize:"12px", marginBottom:"16px" }}>Las agencias aquí configuradas mostrarán el icono de prioridad en todas sus tarjetas de forma automática.</div>

                  {/* Input añadir */}
                  <div style={{ display:"flex", gap:"8px", marginBottom:"16px" }}>
                    <input value={nueva} onChange={e => setNueva(e.target.value)}
                      onKeyDown={e => e.key==="Enter" && agregar()}
                      placeholder="Nombre de agencia..."
                      style={{ flex:1, background:"#111116", border:"1px solid #3F3F46", borderRadius:"8px", color:"#F3F4F6", padding:"8px 12px", fontSize:"13px", outline:"none", fontFamily:"inherit" }} />
                    <button onClick={agregar} style={{ background:"#22C55E", border:"none", color:"#fff", borderRadius:"8px", padding:"8px 18px", cursor:"pointer", fontWeight:700, fontSize:"13px", fontFamily:"inherit" }}>+ Añadir</button>
                  </div>

                  {/* Agencias configuradas */}
                  {agenciasPrioritarias.length === 0
                    ? <div style={{ color:"#606070", textAlign:"center", padding:"30px", fontSize:"13px" }}>No hay agencias prioritarias configuradas</div>
                    : <div style={{ display:"flex", flexDirection:"column", gap:"4px", marginBottom:"20px" }}>
                        {agenciasPrioritarias.map((ag, idx) => (
                          <div key={ag} style={{ display:"flex", alignItems:"center", gap:"10px", background:"#1A1A24", border:"1px solid #2A2A35", borderRadius:"8px", padding:"8px 14px" }}>
                            <svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="11" fill="#ef4444"/><polygon points="12.5,3 7,12 11,12 9.5,19 15,10 11,10" fill="#fbbf24"/></svg>
                            <span style={{ color:"#F3F4F6", fontWeight:700, fontSize:"13px", flex:1 }}>{ag}</span>
                            <button onClick={() => saveAgenciasPrioritarias(agenciasPrioritarias.filter((_,i)=>i!==idx))}
                              style={{ background:"#3d0f0f", border:"none", color:"#fca5a5", borderRadius:"6px", padding:"4px 10px", cursor:"pointer", fontSize:"12px", fontFamily:"inherit" }}>🗑️ Quitar</button>
                          </div>
                        ))}
                      </div>
                  }

                  {/* Agencias de cargas para añadir rápido */}
                  {enCargas.length > 0 && (
                    <div style={{ background:"#111118", border:"1px solid #2A2A35", borderRadius:"8px", padding:"12px" }}>
                      <div style={{ fontSize:"11px", color:"#9CA3AF", fontWeight:700, marginBottom:"8px" }}>AGENCIAS EN CARGAS ACTUALES — clic para añadir</div>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
                        {enCargas.map(ag => {
                          const yaEsta = agenciasPrioritarias.some(p => p.toUpperCase()===ag.toUpperCase());
                          return (
                            <button key={ag} onClick={() => { if (!yaEsta) saveAgenciasPrioritarias([...agenciasPrioritarias, ag.toUpperCase()]); }}
                              style={{ background: yaEsta ? "#14532d" : "#1A1A24", border:`1px solid ${yaEsta ? "#22C55E" : "#3F3F46"}`, borderRadius:"6px", color: yaEsta ? "#4ade80" : "#E5E7EB", padding:"4px 10px", cursor: yaEsta ? "default" : "pointer", fontSize:"11px", fontFamily:"inherit", fontWeight: yaEsta ? 700 : 400 }}>
                              {yaEsta ? "✓ " : ""}{ag}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            };
            return <PrioTab />;
          })()}

          {configTab === "productos" && (
            <div style={{ maxWidth:"900px", margin:"0 auto" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"16px" }}>
                <div style={{ fontSize:"11px", fontWeight:700, color:"#10B981", textTransform:"uppercase", letterSpacing:"0.08em" }}>Catálogo de Productos</div>
                <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
                  {catalogoFecha && <span style={{ fontSize:"11px", color:"#9CA3AF" }}>Última actualización: <strong style={{ color:"#10B981" }}>{catalogoFecha}</strong></span>}
                  <label style={{ background:"#10B981", border:"none", color:"#fff", borderRadius:"6px", padding:"7px 14px", cursor:"pointer", fontWeight:700, fontSize:"12px", fontFamily:"inherit", display:"inline-block" }}>
                    📂 Cargar Excel
                    <input type="file" accept=".xlsx,.xls" style={{ display:"none" }} onChange={e => {
                      const file = e.target.files[0]; if (!file) return;
                      const reader = new FileReader();
                      reader.onload = ev => {
                        try {
                          const wb = XLSX.read(ev.target.result, { type:"array" });
                          const ws = wb.Sheets[wb.SheetNames[0]];
                          // Buscar la fila de cabeceras (puede estar en fila 1 o 2)
                          let rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
                          if (rows.length > 0) {
                            const firstKey = Object.keys(rows[0])[0] || "";
                            // Si la primera fila no tiene cabeceras reconocibles, saltar
                            if (!firstKey.match(/código|cod|desc|pck|uds/i)) {
                              rows = XLSX.utils.sheet_to_json(ws, { defval:"", range:1 });
                            }
                          }
                          const nuevos = rows.map(r => {
                            const cod = String(r["Código"] || r["CÓDIGO"] || r["codigo"] || r["COD"] || r["Cod"] || "").trim().toUpperCase();
                            const desc = String(r["Descripción"] || r["DESCRIPCIÓN"] || r["descripcion"] || r["DESC"] || "").trim();
                            const pck = String(r["PCK/CJ"] || r["pck"] || r["PCK"] || "").trim();
                            const uds = String(r["Uds/Pale"] || r["UDS/PALE"] || r["uds"] || r["UDS"] || "").trim();
                            return { cod, desc, pck, uds };
                          }).filter(r => r.cod);
                          if (nuevos.length === 0) { alert("No se encontraron productos. Asegúrate de que el Excel tiene columnas: Código, Descripción, PCK/CJ, Uds/Pale"); return; }
                          setProductos(nuevos);
                          const fecha = new Date().toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
                          setCatalogoFecha(fecha);
                          alert("✓ Catálogo actualizado: " + nuevos.length + " productos cargados");
                        } catch(err) { alert("Error al leer el archivo: " + err.message); }
                      };
                      reader.readAsArrayBuffer(file);
                      e.target.value = "";
                    }} />
                  </label>
                </div>
              </div>
              {/* Formulario añadir */}
              <div style={{ display:"grid", gridTemplateColumns:"1fr 2fr 90px 90px auto", gap:"8px", marginBottom:"16px", alignItems:"end" }}>
                <div>
                  <div style={{ fontSize:"10px", color:"#9CA3AF", marginBottom:"4px" }}>CÓDIGO</div>
                  <input style={{ width:"100%", background:"#111113", border:"1px solid #3F3F46", borderRadius:"6px", color:"#F3F4F6", padding:"7px 10px", fontSize:"13px", outline:"none", fontFamily:"inherit" }}
                    placeholder="0005" value={prodEdit.cod} onChange={e => setProdEdit(p=>({...p, cod:e.target.value.toUpperCase()}))} />
                </div>
                <div>
                  <div style={{ fontSize:"10px", color:"#9CA3AF", marginBottom:"4px" }}>DESCRIPCIÓN</div>
                  <input style={{ width:"100%", background:"#111113", border:"1px solid #3F3F46", borderRadius:"6px", color:"#F3F4F6", padding:"7px 10px", fontSize:"13px", outline:"none", fontFamily:"inherit" }}
                    placeholder="EG 0.0 TOSTADA BARRIL 20L" value={prodEdit.desc} onChange={e => setProdEdit(p=>({...p, desc:e.target.value}))} />
                </div>
                <div>
                  <div style={{ fontSize:"10px", color:"#9CA3AF", marginBottom:"4px" }}>PCK/CJ</div>
                  <input style={{ width:"100%", background:"#111113", border:"1px solid #3F3F46", borderRadius:"6px", color:"#F3F4F6", padding:"7px 10px", fontSize:"13px", outline:"none", fontFamily:"inherit", textAlign:"center" }}
                    placeholder="12" type="number" value={prodEdit.pck} onChange={e => setProdEdit(p=>({...p, pck:e.target.value}))} />
                </div>
                <div>
                  <div style={{ fontSize:"10px", color:"#9CA3AF", marginBottom:"4px" }}>UDS/PALE</div>
                  <input style={{ width:"100%", background:"#111113", border:"1px solid #3F3F46", borderRadius:"6px", color:"#F3F4F6", padding:"7px 10px", fontSize:"13px", outline:"none", fontFamily:"inherit", textAlign:"center" }}
                    placeholder="48" type="number" value={prodEdit.uds} onChange={e => setProdEdit(p=>({...p, uds:e.target.value}))} />
                </div>
                <button onClick={() => {
                  if (!prodEdit.cod.trim()) return;
                  const existe = productos.findIndex(p => p.cod === prodEdit.cod.trim());
                  if (existe >= 0) {
                    setProductos(prev => prev.map((p,i) => i===existe ? {...prodEdit, cod:prodEdit.cod.trim()} : p));
                  } else {
                    setProductos(prev => [...prev, {...prodEdit, cod:prodEdit.cod.trim()}]);
                  }
                  setProdEdit({ cod:"", desc:"", pck:"", uds:"" });
                }} style={{ background:"#10B981", border:"none", color:"#fff", borderRadius:"6px", padding:"7px 16px", cursor:"pointer", fontWeight:700, fontSize:"13px", fontFamily:"inherit", whiteSpace:"nowrap" }}>+ Añadir</button>
              </div>
              {/* Tabla productos */}
              {productos.length === 0 ? (
                <div style={{ color:"#9CA3AF", fontSize:"13px", textAlign:"center", padding:"40px", background:"#161620", borderRadius:"8px", border:"1px solid #1E1E2A" }}>
                  No hay productos guardados. Añade el primero arriba.
                </div>
              ) : (
                <div style={{ background:"#161620", borderRadius:"8px", border:"1px solid #1E1E2A", overflow:"hidden" }}>
                  <div style={{ display:"grid", gridTemplateColumns:"90px 1fr 90px 90px 60px", gap:0, borderBottom:"2px solid #1E1E2A", padding:"8px 12px" }}>
                    {["CÓDIGO","DESCRIPCIÓN","PCK/CJ","UDS/PALE",""].map(h => (
                      <div key={h} style={{ fontSize:"10px", fontWeight:700, color:"#9CA3AF", letterSpacing:"0.06em" }}>{h}</div>
                    ))}
                  </div>
                  {productos.sort((a,b)=>a.cod.localeCompare(b.cod)).map((p, idx) => (
                    <div key={p.cod} style={{ display:"grid", gridTemplateColumns:"90px 1fr 90px 90px 60px", gap:0, padding:"8px 12px", borderBottom:"1px solid #1E1E2A", alignItems:"center",
                      background: idx%2===0 ? "transparent" : "#13131A" }}>
                      <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"13px", color:"#D946EF", fontWeight:700 }}>{p.cod}</div>
                      <div style={{ fontSize:"13px", color:"#F3F4F6" }}>{p.desc || <span style={{color:"#555"}}>—</span>}</div>
                      <div style={{ fontSize:"13px", color:"#F3F4F6", textAlign:"center" }}>{p.pck || <span style={{color:"#555"}}>—</span>}</div>
                      <div style={{ fontSize:"13px", color:"#F3F4F6", textAlign:"center" }}>{p.uds || <span style={{color:"#555"}}>—</span>}</div>
                      <div style={{ display:"flex", gap:"4px", justifyContent:"flex-end" }}>
                        <button onClick={() => setProdEdit({cod:p.cod, desc:p.desc||"", pck:p.pck||"", uds:p.uds||""})}
                          style={{ background:"#27272A", border:"none", color:"#9CA3AF", borderRadius:"4px", padding:"3px 7px", cursor:"pointer", fontSize:"11px" }}>✏️</button>
                        <button onClick={() => setProductos(prev => prev.filter((_,i)=>i!==idx))}
                          style={{ background:"#3d0f0f", border:"none", color:"#fca5a5", borderRadius:"4px", padding:"3px 7px", cursor:"pointer", fontSize:"11px" }}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <div style={{ marginTop:"12px", fontSize:"11px", color:"#9CA3AF", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span>{productos.length} producto{productos.length!==1?"s":""} en el catálogo. Se autocompletarán PCK/CJ y Uds/Pale al cargar Excel en Centros Logísticos.</span>
                <span style={{ color:"#555", fontSize:"10px" }}>Formato Excel: columnas Código · Descripción · PCK/CJ · Uds/Pale</span>
              </div>
            </div>
          )}
          </div>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{ padding:"40px", color:"#ef4444", fontFamily:"monospace", background:"#111", minHeight:"100vh" }}>
        <h2>⚠️ Error de la aplicación</h2>
        <pre style={{ whiteSpace:"pre-wrap", fontSize:"12px", marginTop:"16px", color:"#fca5a5" }}>{String(this.state.error)}</pre>
        <p style={{ color:"#9CA3AF", marginTop:"16px", fontSize:"12px" }}>Abre F12 → Console para más detalles</p>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
